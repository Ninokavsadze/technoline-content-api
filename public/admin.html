<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Technoline — ადმინ პანელი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1B2B; --ink-soft:#4A5A6C; --ink-faint:#7C8CA0;
    --paper:#FFFFFF; --paper-soft:#F6F8FB; --paper-deep:#EEF2F7;
    --line:#E1E7EF; --line-soft:#EDF1F6;
    --blue:#0E4F8E; --blue-deep:#0A3A69; --blue-deeper:#082B4E; --blue-soft:#DCEAF6; --blue-soft-2:#B8D2E8; --blue-mid:#5C86AE;
    --gold:#FCBB2D; --gold-deep:#C98A08; --gold-soft:#FFD788; --gold-ghost:#FFEAC5;
    --ok:#1E8E5A; --warn:#C98A08; --err:#C0392B;
    --series-ai:#2a78d6; --series-operator:#eb6834;
    --font-geo:'Noto Sans Georgian','Segoe UI',sans-serif;
    --font-display:'Unbounded','Noto Sans Georgian',sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EEF4FB; --ink-soft:#AFC0D5; --ink-faint:#7E93AC;
      --paper:#0C1826; --paper-soft:#0F1F32; --paper-deep:#13273D;
      --line:#1E3B58; --line-soft:#173049;
      --blue:#5FA0DC; --blue-deep:#82B4E6; --blue-deeper:#B8D2E8; --blue-soft:#123350; --blue-soft-2:#1B4468; --blue-mid:#7FA9D2;
      --gold:#FCBB2D; --gold-deep:#FFD054; --gold-soft:#E4A028; --gold-ghost:#2E2410;
      --series-ai:#3987e5; --series-operator:#d95926;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EEF4FB; --ink-soft:#AFC0D5; --ink-faint:#7E93AC;
    --paper:#0C1826; --paper-soft:#0F1F32; --paper-deep:#13273D;
    --line:#1E3B58; --line-soft:#173049;
    --blue:#5FA0DC; --blue-deep:#82B4E6; --blue-deeper:#B8D2E8; --blue-soft:#123350; --blue-soft-2:#1B4468; --blue-mid:#7FA9D2;
    --gold:#FCBB2D; --gold-deep:#FFD054; --gold-soft:#E4A028; --gold-ghost:#2E2410;
    --series-ai:#3987e5; --series-operator:#d95926;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-geo);background:var(--paper-soft);color:var(--ink);-webkit-font-smoothing:antialiased}
  svg{display:block}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--gold-deep);outline-offset:2px;border-radius:4px}
  .icon{width:20px;height:20px}

  /* ---------- login screen ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 600px at 15% -10%, var(--blue-soft), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--gold-ghost), transparent 55%), var(--paper-soft);}
  .login-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:36px 32px;box-shadow:0 24px 60px -24px rgba(10,30,55,.25)}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .login-brand svg{width:34px;height:34px;color:var(--blue)}
  .login-brand .lb-text{display:flex;flex-direction:column;line-height:1.15}
  .login-brand b{font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
  .login-brand span{font-size:.72rem;color:var(--ink-faint);font-weight:600;letter-spacing:.02em}
  .login-card h1{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin:0 0 6px}
  .login-card p{font-size:.9rem;color:var(--ink-soft);margin:0 0 22px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.95rem;transition:border-color .15s}
  .field input:focus{border-color:var(--blue);background:var(--paper)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 20px;font-weight:700;font-size:.92rem;transition:transform .12s,box-shadow .12s,background .12s}
  .btn:active{transform:scale(.97)}
  .btn-gold{background:var(--gold);color:#241A00;box-shadow:0 10px 22px -10px rgba(201,138,8,.55)}
  .btn-gold:hover{background:var(--gold-deep)}
  .btn-gold:disabled{opacity:.55;cursor:default;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn-block{width:100%}
  .login-err{margin-top:12px;font-size:.85rem;color:var(--err);font-weight:600;display:none}
  .login-err.show{display:block}
  .login-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);font-size:.78rem;color:var(--ink-faint);line-height:1.6}
  .login-foot code{background:var(--paper-deep);padding:1px 6px;border-radius:5px;font-size:.78em}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:252px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"side top" "side main"}
  #app.is-active{display:grid}
  #topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--paper);border-bottom:1px solid var(--line);gap:16px}
  .tb-title{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
  .tb-sub{font-size:.78rem;color:var(--ink-faint);margin-top:1px}
  .tb-right{display:flex;align-items:center;gap:10px}
  .conn-pill{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink-soft);background:var(--paper-soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
  .conn-pill.ok .conn-dot{background:var(--ok)}
  .conn-pill.err .conn-dot{background:var(--err)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s,color .15s}
  .icon-btn:hover{border-color:var(--blue);color:var(--blue)}
  .icon-btn svg{width:18px;height:18px}

  #sidebar{grid-area:side;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .side-brand{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
  .side-brand svg{width:28px;height:28px;color:var(--blue);flex:none}
  .side-brand b{font-family:var(--font-display);font-weight:800;font-size:.98rem;display:block}
  .side-brand span{font-size:.68rem;color:var(--ink-faint);font-weight:700;letter-spacing:.03em}
  .side-scroll{flex:1;overflow-y:auto;padding:14px 12px 20px}
  .side-group{margin-bottom:4px}
  .side-group-label{font-size:.68rem;font-weight:800;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;padding:14px 10px 6px}
  .side-group-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;font:inherit;margin:0}
  .side-group-toggle:hover{color:var(--ink-soft)}
  .side-group-toggle svg{width:12px;height:12px;flex:none;transition:transform .15s ease}
  .side-group-toggle.is-collapsed svg{transform:rotate(-90deg)}
  .side-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-size:.87rem;font-weight:600;margin-bottom:2px;transition:background .12s,color .12s}
  .side-btn:hover{background:var(--paper-soft);color:var(--ink)}
  .side-btn.is-active{background:var(--blue-soft);color:var(--blue-deep);font-weight:800}
  :root[data-theme="dark"] .side-btn.is-active{color:var(--blue)}
  @media (prefers-color-scheme: dark){ .side-btn.is-active{color:var(--blue)} }
  .side-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
  .side-foot{padding:14px 20px;border-top:1px solid var(--line-soft)}
  .side-foot .btn{width:100%}

  #main{grid-area:main;overflow-y:auto;padding:28px 34px 60px}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .panel-head h2{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:0 0 4px}
  .panel-head p{margin:0;font-size:.87rem;color:var(--ink-soft);max-width:62ch;line-height:1.55}
  .status-chip{font-size:.78rem;font-weight:700;padding:6px 13px;border-radius:999px;white-space:nowrap}
  .status-chip.saved{background:var(--blue-soft);color:var(--blue-deep)}
  .status-chip.dirty{background:var(--gold-ghost);color:var(--gold-deep)}
  .status-chip.saving{background:var(--paper-deep);color:var(--ink-faint)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}

  .ca-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
  .ca-tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .ca-tile-label{font-size:.78rem;font-weight:700;color:var(--ink-faint);margin-bottom:8px}
  .ca-tile-value{font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--ink);line-height:1.1}
  .ca-tile-sub{font-size:.78rem;color:var(--ink-soft);margin-top:5px}
  .ca-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);margin-bottom:14px}
  .ca-legend-item{display:flex;align-items:center;gap:6px}
  .ca-legend-swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .ca-chart{position:relative}
  .ca-bars{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line)}
  .ca-bar-group{flex:1;min-width:2px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer}
  .ca-bar-seg{width:100%;flex:none}
  .ca-bar-seg.ai{background:var(--series-ai)}
  .ca-bar-seg.operator{background:var(--series-operator)}
  .ca-bar-seg:first-child{border-radius:4px 4px 0 0}
  .ca-bar-axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-faint);margin-top:6px}
  .ca-tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.78rem;padding:7px 11px;border-radius:8px;z-index:50;display:none;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
  .ca-table{width:100%;border-collapse:collapse;font-size:.86rem}
  .ca-table th{text-align:left;font-size:.76rem;color:var(--ink-faint);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line)}
  .ca-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  .ca-table tr:last-child td{border-bottom:none}
  .field-block{margin-bottom:18px}
  .field-block:last-child{margin-bottom:0}
  .field-block label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
  .field-block label .ck-key{font-weight:600;font-family:monospace;font-size:.72rem;color:var(--ink-faint);background:var(--paper-soft);padding:1px 7px;border-radius:6px}
  .field-block textarea{width:100%;min-height:64px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.88rem;line-height:1.55;resize:vertical;transition:border-color .15s}
  .field-block textarea:focus{border-color:var(--blue);background:var(--paper)}
  .field-block input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.9rem;transition:border-color .15s}
  .field-block input[type=text]:focus{border-color:var(--blue);background:var(--paper)}
  .seg-label{margin:26px 0 10px;font-weight:800;font-size:.86rem;color:var(--blue)}
  .seg-label:first-child{margin-top:0}

  .color-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .color-row:last-child{border-bottom:none}
  .color-row input[type=color]{width:46px;height:46px;padding:0;border:1.5px solid var(--line);border-radius:11px;background:none;cursor:pointer}
  .color-row .cr-label{flex:1;font-size:.9rem;font-weight:700}
  .color-row .cr-hex{font-family:monospace;font-size:.82rem;color:var(--ink-faint);background:var(--paper-soft);padding:3px 9px;border-radius:7px}

  table.admin-table{width:100%;border-collapse:collapse}
  table.admin-table th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:800;padding:0 10px 10px;border-bottom:1.5px solid var(--line)}
  table.admin-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
  table.admin-table tr:last-child td{border-bottom:none}
  table.admin-table input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper-soft);color:var(--ink);font-size:.86rem}
  table.admin-table input:focus{border-color:var(--blue);background:var(--paper)}
  .part-photo-cell{display:flex;align-items:center;gap:10px}
  .part-thumb{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper-soft);object-fit:cover;flex:none}
  .part-thumb-empty{width:52px;height:52px;border-radius:10px;border:1.5px dashed var(--line);background:var(--paper-soft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:1.3rem}
  .part-photo-actions{display:flex;flex-direction:column;gap:4px}
  .part-photo-actions label{font-size:.76rem;font-weight:700;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;text-align:left}
  .part-photo-actions button{font-size:.76rem;font-weight:700;color:var(--ink-faint);cursor:pointer;background:none;border:none;padding:0;text-align:left}
  .part-photo-actions input[type=file]{display:none}
  .field-hint{font-size:.8rem;color:var(--ink-faint);line-height:1.5}

  .bg-type-row{display:flex;gap:10px;margin-bottom:16px}
  .bg-type-btn{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink-soft);font-size:.86rem;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .bg-type-btn.is-active{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-soft)}
  .drag-preview{-webkit-user-select:none;user-select:none;touch-action:none}
  .drag-chip{background:rgba(8,18,30,.62);backdrop-filter:blur(2px);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;transition:opacity .15s}
  .drag-chip.is-dragging{cursor:grabbing;border-color:var(--gold)}
  .drag-chip.is-hidden{opacity:.42}
  .drag-chip-label{color:#fff;font-size:.78rem;font-weight:700;white-space:nowrap}
  .drag-eye{background:none;border:none;padding:0;cursor:pointer;font-size:.9rem;line-height:1;opacity:.9}
  .drag-eye:hover{opacity:1}

  .branch-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .branch-card:last-child{margin-bottom:0}
  .branch-card h3{margin:0 0 12px;font-size:.95rem;font-weight:800;color:var(--blue)}
  .branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:760px){.branch-grid{grid-template-columns:1fr}}

  .save-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 0 4px;margin-top:6px;background:linear-gradient(180deg, transparent, var(--paper-soft) 30%)}

  .booking-row{display:grid;grid-template-columns:110px 1fr 140px 90px;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-soft);font-size:.86rem}
  .booking-row:last-child{border-bottom:none}
  .booking-row .bcode{font-family:monospace;font-weight:800;color:var(--blue)}
  .booking-row .bname{font-weight:700}
  .booking-row .bmeta{color:var(--ink-faint);font-size:.8rem;margin-top:2px}
  .booking-row .bstatus{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep);text-align:center;white-space:nowrap}
  @media (max-width:760px){.booking-row{grid-template-columns:1fr;gap:4px}}

  /* Bookings: spreadsheet-style table (sticky header, grid lines, zebra rows, sortable columns) */
  .xl-filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-top:12px}
  .xl-filters .xl-f{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--ink-soft)}
  .xl-filters input[type=date],.xl-filters input[type=time],.xl-filters select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper-soft);color:var(--ink);font-size:.84rem;font-family:inherit}
  .xl-filters input:focus,.xl-filters select:focus{outline:none;border-color:var(--blue);background:var(--paper)}
  .xl-chip{padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-soft);font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit}
  .xl-chip:hover{border-color:var(--blue);color:var(--blue-deep)}
  .xl-count{font-size:.8rem;color:var(--ink-faint);margin:0 0 8px 2px}
  .xl-wrap{overflow:auto;max-height:calc(100vh - 330px);min-height:240px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
  .xl-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.82rem}
  .xl-table th,.xl-table td{padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
  .xl-table th:last-child,.xl-table td:last-child{border-right:none}
  .xl-table thead th{position:sticky;top:0;z-index:2;background:#E9EEF5;color:var(--ink);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none;border-bottom:2px solid #C9D3E0}
  .xl-table thead th:hover{background:#DDE5F0}
  .xl-table thead th .xl-arrow{display:inline-block;width:12px;margin-left:4px;color:var(--blue);font-size:.7rem}
  .xl-table th.xl-rn,.xl-table td.xl-rn{position:sticky;left:0;z-index:1;background:#F1F4F9;color:var(--ink-faint);text-align:center;font-weight:700;min-width:44px;cursor:default}
  .xl-table thead th.xl-rn{z-index:3;background:#E9EEF5}
  .xl-table tbody tr:nth-child(even) td{background:#F8FAFC}
  .xl-table tbody tr:nth-child(even) td.xl-rn{background:#F1F4F9}
  .xl-table tbody tr:hover td{background:var(--blue-soft)}
  .xl-table td.xl-code{font-family:monospace;font-weight:800;color:var(--blue)}
  .xl-table td.xl-name{font-weight:700}
  .xl-pill{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep)}
  .xl-ok{color:var(--good,#237A4C);font-weight:700}
  .xl-bad{color:var(--bad,#B3261E);font-weight:700}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint)}
  .empty-state svg{width:40px;height:40px;margin:0 auto 14px;opacity:.5}
  .empty-state p{margin:0;font-size:.9rem}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:12px;font-size:.86rem;font-weight:600;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:999}
  :root[data-theme="dark"] .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  @media (prefers-color-scheme: dark){ .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)} }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #chat-lightbox{position:fixed;inset:0;background:rgba(4,10,18,.88);z-index:1200;display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
  #chat-lightbox.show{display:flex}

  .chat-attachment-audio{display:block;max-width:230px;height:36px;margin-bottom:6px}
  /* AI-agent reply formatting — mirrors the customer-facing chat widget's
     bullet list / line-break / map-link / tel-link rendering (see
     formatChatReplyHtml below) so an operator reading the AI's replies in
     the back-office sees the same readable layout the customer saw. */
  .chat-msg-text ul.chat-msg-list{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:9px;list-style:disc outside}
  .chat-msg-text ul.chat-msg-list li{padding-left:2px}
  .chat-msg-text p.chat-msg-line{margin:0}

  .chat-bullet-line{display:block}
  .chat-bullet-line + .chat-bullet-line{margin-top:3px}
  .chat-map-link{color:var(--blue-deep);font-weight:800;text-decoration:underline;text-underline-offset:2px;display:inline;word-break:break-word}
  .chat-map-link svg{width:13px;height:13px;vertical-align:-2px;margin-left:1px}
  .chat-tel-link{color:var(--blue-deep);font-weight:800;text-decoration:underline;text-underline-offset:2px}
  .chat-tool-btn{width:32px;height:32px;border-radius:9px;border:none;background:none;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

ეთ საიტზე დაბრუნებისას და ჩატში ხელახლა არ გკითხოთ სახელი/ტელეფონი. სტატისტიკისა და საიტის გაუმჯობესების მიზნით შესაძლოა გამოყენებულ იქნას Google Analytics/Google Tag Manager-ის ანონიმური, აგრეგირებული სტატისტიკის ქუქი-ფაილები — ამ შემთხვევაში მოქმედებს Google-ის საკუთარი კონფიდენციალურობის პირობები. ბრაუზერის პარამეტრებში შეგიძლიათ ნებისმიერ დროს გამორთოთ ან წაშალოთ ქუქი-ფაილები.","privacy.s4.title":"4. მონაცემთა გაზიარება მესამე მხარეებთან","privacy.s4.body":"თქვენს მონაცემებს არ ვყიდით და არ ვუზიარებთ მესამე პირებს სარეკლამო მიზნით. SMS-კოდებისა და შეტყობინებების გასაგზავნად ვიყენებთ სანდო SMS-პროვაიდერს, ხოლო ვიზიტის ჯავშნის მართვისთვის — Smart Q-Logic-ის სისტემას. ეს პარტნიორები თქვენს მონაცემებს იღებენ მხოლოდ იმ მოცულობით, რაც კონკრეტული ფუნქციის (SMS-ის მიტანა, ჯავშნის დამუშავება) შესასრულებლად არის საჭირო.","privacy.s5.title":"5. შენახვა და უსაფრთხოება","privacy.s5.body":"მონაცემები ინახება კომპანიის სერვერებზე იმ ვადით, რაც საჭიროა მომსახურების გასაწევად და გარანტიული ვალდებულებების შესასრულებლად, ან კანონმდებლობით დადგენილ ვადამდე. წვდომა შეზღუდულია მხოლოდ იმ პერსონალზე, ვისთვისაც ეს სამუშაო მოვალეობის შესასრულებლად აუცილებელია.","privacy.s6.title":"6. თქვენი უფლებები და კონტაქტი","privacy.s6.body":"გაქვთ უფლება მოითხოვოთ თქვენი პირადი მონაცემების ასლი, შესწორება ან წაშლა. ამისთვის დაგვიკავშირდით — <a href=\"#contact\" data-route=\"contact\" style=\"color:var(--blue);font-weight:700\">საკონტაქტო გვერდზე</a> მითითებულ არხებზე. წინამდებარე პოლიტიკა პერიოდულად შეიძლება განახლდეს — ცვლილების თარიღი მითითებულია გვერდის თავში.","home.services.lead.tag":"სმარტფონები","home.services.card2.tag":"კომპიუტერები","home.services.card3.tag":"პლანშეტები","home.services.card4.tag":"სმარტ-საათები","home.services.card5.tag":"სათამაშო კონსოლები","about.band.cta":"ფილიალების ნახვა","wservice.band.checkCta":"შემოწმება","wservice.band.bookCta":"დაჯავშნა","footer.termsLink":"წესები და პირობები"};

  function parseCk(key){
    var parts = key.split('.');
    var page = parts[0];
    if(parts.length >= 3) return {page:page, sub:parts[1], field:parts.slice(2).join('.')};
    var last = parts[1];
    var m = last.match(/^([a-zA-Z]+)(\d)(Num|Label)$/);
    if(m) return {page:page, sub:m[1]+m[2], field:m[3]};
    return {page:page, sub:null, field:last};
  }
  function humanizeSegment(seg){
    var m = seg.match(/^([a-zA-Z]+?)(\d+)$/);
    if(m) return (SEGMENT_LABELS[m[1]] || m[1]) + ' ' + m[2];
    return SEGMENT_LABELS[seg] || seg;
  }

      .replace(/:-?[pP]/g, '😛')
      .replace(/:-?[oO]/g, '😮')
      .replace(/[xX]D/g, '😂')
      .replace(/:-?\|/g, '😐');
  }
  function openChatLightbox(src){
    var box = document.getElementById('chat-lightbox');
    var img = document.getElementById('chat-lightbox-img');
    if(!box || !img) return;
    img.src = src;
    box.classList.add('show');
  }
  function closeChatLightbox(){
    var box = document.getElementById('chat-lightbox');
    if(box) box.classList.remove('show');
  }
  document.getElementById('chat-lightbox') && document.getElementById('chat-lightbox').addEventListener('click', closeChatLightbox);
  // registered once (not per chat-thread render, which happens on every
  // incoming message) — both elements are looked up fresh each click, so
  // this keeps working across re-renders without stacking duplicate listeners
  document.addEventListener('click', function(e){
    var pop = document.getElementById('chat-emoji-popover');
    var btn = document.getElementById('chat-reply-emoji-btn');
    if(!pop || !pop.classList.contains('show')) return;
    if(!pop.contains(e.target) && !(btn && btn.contains(e.target))) pop.classList.remove('show');
  });
  var warrantyLoaded = { records:false, template:false };
  var warrantySubTab = 'records';
  // Which segment sub-tab is active per content page (e.g. "services" ->
  // "row3") — content pages with many repeated segments (services rows,
  // home stat/step/card blocks, wservice/terms sections) were one long
  // stacked list of textareas and staff had to scroll through all of them
  // to reach one field; now only the selected segment's fields render.
  var contentSubTab = {};
  // Which language the content tabs (renderContentPanel / renderListContentPanel)
  // are currently showing/editing — 'ka' edits state.content + saves to
  // content-site (unchanged, original behavior); 'en' edits state.contentEn +
  // saves to content-site-en. Persisted locally so it survives a reload.
  var CONTENT_LANG_KEY = 'tl_admin_content_lang';
  var contentLang = (function(){ try{ return localStorage.getItem(CONTENT_LANG_KEY) === 'en' ? 'en' : 'ka'; }catch(e){ return 'ka'; } })();
  function setContentLang(lang){
    contentLang = lang === 'en' ? 'en' : 'ka';
    try{ localStorage.setItem(CONTENT_LANG_KEY, contentLang); }catch(e){}
  }
  // Current store + fallback-default for a single-key content field,
  // language-aware. Georgian keeps the original behavior (admin override,
  // else the page's built-in default). English has no built-in default of
  // its own here — an untranslated field just shows empty with a hint, and
  // falls back to the Georgian text on the live site (see resolveCk there).
  function ckStore(){ return contentLang === 'en' ? state.contentEn : state.content; }
  function contentValFor(k){
    if(contentLang === 'en') return Object.prototype.hasOwnProperty.call(state.contentEn, k) ? state.contentEn[k] : '';
    return Object.prototype.hasOwnProperty.call(state.content, k) ? state.content[k] : CONTENT_DEFAULTS[k];
  }
  function contentLangToggleHtml(){
    return '<div class="bg-type-row" style="margin-bottom:14px">'
      + '<button type="button" class="bg-type-btn'+(contentLang==='ka'?' is-active':'')+'" data-content-lang="ka">ქართული</button>'
      + '<button type="button" class="bg-type-btn'+(contentLang==='en'?' is-active':'')+'" data-content-lang="en">English</button>'
      + '</div>'
      + (contentLang==='en' ? '<p class="field-hint" style="margin:-8px 0 14px">თარგმანი ჯერ არ არის შევსებული ველებისთვის — ცარიელი ველი საიტზე ავტომატურად აჩვენებს ქართულ ტექსტს.</p>' : '');
  }
  function wireContentLangToggle(main, tab){
    main.querySelectorAll('[data-content-lang]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var lang = btn.getAttribute('data-content-lang');
        if(lang === contentLang) return;
        setContentLang(lang);
        renderMain();
      });
    });
  }

  // Content pages are split into three sidebar subgroups so staff aren't
  // scrolling one long flat list to find a page — "informational" static
  // pages, the two pages that actually call the live Q-Logic APIs, and
  // everything else (plain content). A page not listed here falls into
  // 'main' by default.
  var CONTENT_SUBGROUP_OF_PAGE = {
    chatWidget: 'info', wservice: 'info', terms: 'info', privacy: 'info',
    'warranty-check': 'api', booking: 'api'
  };
  function buildTabs(){
    TABS = [];
    var seenPages = {};
    CONTENT_ORDER.forEach(function(k){ seenPages[parseCk(k).page] = true; });
    PAGE_ORDER.forEach(function(page){
      if(seenPages[page]) TABS.push({id:'content:'+page, label:PAGE_LABELS[page] || page, kind:'content', page:page, group:'content', subgroup: CONTENT_SUBGROUP_OF_PAGE[page] || 'main'});
    });
    TABS.push({id:'pages', label:'გვერდები', kind:'pages', group:'other'});
    TABS.push({id:'colors', label:'ბრენდის ფერები', kind:'colors', group:'other'});
    TABS.push({id:'typography', label:'ბანერები', kind:'typography', group:'other'});
    TABS.push({id:'parts', label:'ნაწილების კატალოგი', kind:'parts', group:'other'});
    TABS.push({id:'branches', label:'ფილიალები', kind:'branches', group:'other'});
    TABS.push({id:'warranty', label:'საგარანტიო ბარათი', kind:'warranty', group:'other'});
    TABS.push({id:'bookings', label:'ვიზიტების ჯავშნები', kind:'bookings', group:'other'});
    TABS.push({id:'booking-options', label:'ჯავშნის პარამეტრები', kind:'booking-options', group:'other'});
    TABS.push({id:'chat', label:'ლაივ ჩატი', kind:'chat', group:'other'});
    TABS.push({id:'chat-analytics', label:'ჩატების ანალიტიკა', kind:'chat-analytics', group:'other'});
    TABS.push({id:'feedback', label:'მომხმარებელთა უკუკავშირი', kind:'feedback', group:'other'});
    TABS.push({id:'users', label:'მომხმარებლები', kind:'users', group:'other'});
  }

  var TAB_ICONS = { content:'ic-inbox', pages:'ic-menu', colors:'ic-palette', typography:'ic-palette', parts:'ic-box', branches:'ic-pin', warranty:'ic-lock', bookings:'ic-calendar', 'booking-options':'ic-calendar', chat:'ic-chat', 'chat-analytics':'ic-chart', feedback:'ic-star', users:'ic-user' };

  // Sidebar groups, in the order they render — "საერთო მართვა" first (the
  // tools staff reach for most), then content pages split into three
  // smaller, labeled groups instead of one long flat list.
  var NAV_GROUPS = [
    {key:'other', label:'საერთო მართვა', match:function(t){ return t.group === 'other'; }},
    {key:'content-info', label:'საინფორმაციო გვერდები', match:function(t){ return t.group === 'content' && t.subgroup === 'info'; }},
    {key:'content-api', label:'API სერვისები', match:function(t){ return t.group === 'content' && t.subgroup === 'api'; }},
    {key:'content-main', label:'კონტენტი', match:function(t){ return t.group === 'content' && t.subgroup === 'main'; }}
  ];
  var NAV_COLLAPSE_KEY = 'tl_admin_nav_collapse';
  function loadNavCollapse(){
    try{ return JSON.parse(localStorage.getItem(NAV_COLLAPSE_KEY) || '{}') || {}; }catch(e){ return {}; }
  }
  function saveNavCollapse(){
    try{ localStorage.setItem(NAV_COLLAPSE_KEY, JSON.stringify(navCollapse)); }catch(e){}
  }
  var navCollapse = loadNavCollapse();

  function renderNav(){
    var nav = document.getElementById('side-nav');
    var html = '';
    NAV_GROUPS.forEach(function(g){
      var items = TABS.filter(g.match);
      if(!items.length) return;
      // a group that holds the currently-active tab always renders expanded,
      // so selecting a tab can never hide the very button you just clicked
      var hasActive = items.some(function(t){ return t.id === activeTab; });
      var collapsed = !!navCollapse[g.key] && !hasActive;
      html += '<button type="button" class="side-group-label side-group-toggle'+(collapsed?' is-collapsed':'')+'" data-nav-group="'+g.key+'">'
        + '<span>'+g.label+'</span>'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
        + '</button>';
      if(!collapsed){
        items.forEach(function(t){ html += navBtn(t); });
      }
    });
    nav.innerHTML = html;
    nav.querySelectorAll('[data-nav-group]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-nav-group');
        navCollapse[key] = !navCollapse[key];
        saveNavCollapse();
        renderNav();
      });
    });
    nav.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){
        selectTab(b.getAttribute('data-tab'));
        document.getElementById('sidebar').classList.remove('is-open');
        document.getElementById('sidebar-scrim').classList.remove('show');
      });
    });
  }
  function navBtn(t){
    var icon = TAB_ICONS[t.kind] || 'ic-inbox';
    var badge = '';
    if(t.kind === 'chat'){
      var n = chatUnreadCount();
      if(n) badge = '<span style="margin-left:auto;background:var(--bad,#B3261E);color:#fff;font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 7px;line-height:1.5">'+n+'</span>';
    }
    return '<button class="side-btn' + (t.id===activeTab?' is-active':'') + '" data-tab="'+t.id+'">'
      + '<svg class="icon" style="width:16px;height:16px"><use href="#'+icon+'"/></svg>'
      + '<span>'+t.label+'</span>' + badge + '</button>';
  }

  function dirtyKeyForTab(tab){
    if(tab.kind==='content') return 'content:'+tab.page;
    return tab.kind;
  }
  function isDirty(tab){
    if(tab.kind==='content') return !!dirty.content[tab.page];
    return !!dirty[tab.kind];
  }
  function setDirty(tab, val){
    if(tab.kind==='content') dirty.content[tab.page] = val;
    else dirty[tab.kind] = val;
  }

  function selectTab(id){
    activeTab = id;
    renderNav();
    renderMain();
  }

  function statusChipHtml(tab){
    if(!tab || tab.kind === 'bookings' || tab.kind === 'warranty' || tab.kind === 'feedback' || tab.kind === 'chat') return '';
    var d = isDirty(tab);
    return '<span class="status-chip ' + (d?'dirty':'saved') + '" id="status-chip">' + (d?'ცვლილება არ არის შენახული':'შენახულია') + '</span>';
  }
  function updateStatusChip(tab){
    var el = document.getElementById('status-chip');
    if(!el) return;
    var d = isDirty(tab);
    el.className = 'status-chip ' + (d?'dirty':'saved');
    el.textContent = d ? 'ცვლილება არ არის შენახული' : 'შენახულია';
  }

  function renderMain(){
    var main = document.getElementById('main');
    var tab = TABS.find(function(t){ return t.id === activeTab; });
    document.getElementById('tb-title').textContent = tab ? tab.label : 'მართვის პანელი';

    if(!tab){ main.innerHTML=''; return; }

    if(tab.kind === 'content'){
      var listCfg = LIST_CONTENT_PAGES[tab.page];
      return listCfg ? renderListContentPanel(main, tab, listCfg) : renderContentPanel(main, tab);
    }
    if(tab.kind === 'pages') return renderPagesPanel(main, tab);
    if(tab.kind === 'colors') return renderColorsPanel(main, tab);
    if(tab.kind === 'typography') return renderTypographyPanel(main, tab);
    if(tab.kind === 'parts') return renderPartsPanel(main, tab);
    if(tab.kind === 'branches') return renderBranchesPanel(main, tab);
    if(tab.kind === 'warranty') return renderWarrantyPanel(main, tab);
    if(tab.kind === 'bookings') return renderBookingsPanel(main, tab);
    if(tab.kind === 'booking-options') return renderBookingOptionsPanel(main, tab);
    if(tab.kind === 'chat') return renderChatPanel(main, tab);
    if(tab.kind === 'chat-analytics') return renderChatAnalyticsPanel(main, tab);
    if(tab.kind === 'feedback') return renderFeedbackPanel(main, tab);
    if(tab.kind === 'users') return renderUsersPanel(main, tab);
  }

  function panelHeadHtml(tab, desc){
    return '<div class="panel-head"><div><h2>'+tab.label+'</h2><p>'+desc+'</p></div>' + statusChipHtml(tab) + '</div>';
  }

  // home services rail tiles: each card can carry an optional photo,
  // stored under its own key in the same generic content map (rendered
  // as a photo-upload widget instead of a textarea, right after that
  // card's description field).
  var SVC_TILE_IMAGE_MAP = {
    'home.services.lead.desc': 'home.services.lead.image',
    'home.services.card2.desc': 'home.services.card2.image',
    'home.services.card3.desc': 'home.services.card3.image',
    'home.services.card4.desc': 'home.services.card4.image',
    'home.services.card5.desc': 'home.services.card5.image'
  };
  var SVC_PHOTO_MAX_W = 640;
  var SVC_PHOTO_QUALITY = 0.82;

  function renderSvcPhotoField(imgKey){
    var val = state.content[imgKey];
    return '<div class="field-block">'
      + '<label>ბარათის ფოტო (არასავალდებულო)<span class="ck-key">' + imgKey + '</span></label>'
      + '<div class="part-photo-cell" data-svc-photo-cell="'+escAttr(imgKey)+'">'
        + (val ? '<img class="part-thumb" src="'+val+'" alt="">' : '<div class="part-thumb-empty">—</div>')
        + '<div class="part-photo-actions">'
          + '<label>ატვირთვა<input type="file" accept="image/*" data-svc-photo></label>'
          + (val ? '<button type="button" data-svc-photo-clear>წაშლა</button>' : '')
        + '</div>'
      + '</div>'
      + '<p class="field-hint" style="margin-top:6px">თუ ფოტო არ ატვირთავთ, ბარათზე ფერადი ფონი და ხატულა დარჩება.</p>'
      + '</div>';
  }

  // Card-list editor for LIST_CONTENT_PAGES pages (services rows, terms /
  // wservice clauses): a small fixed "head" card for page-level fields,
  // then one editable card per list item with its own delete button, plus
  // an "add new" button — items can be freely added/removed, unlike the
  // fixed CONTENT_ORDER-driven sub-tabs renderContentPanel uses elsewhere.
  function renderListContentPanel(main, tab, cfg){
    var page = tab.page;
    var html = panelHeadHtml(tab, 'შეცვალეთ ტექსტი და დააჭირეთ „ცვლილებების შენახვას“. ქვემოთ შეგიძლიათ დაამატოთ ახალი ' + cfg.label + ' ან წაშალოთ არსებული — საიტზეც შესაბამისად განახლდება.');
    html += contentLangToggleHtml();

    var fixedKeys = CONTENT_ORDER.filter(function(k){
      var p = parseCk(k);
      return p.page === page && cfg.fixedSubs.indexOf(p.sub) !== -1;
    });
    if(fixedKeys.length){
      html += '<div class="card">';
      fixedKeys.forEach(function(k){
        var val = contentValFor(k);
        html += '<div class="field-block"><label>' + labelForCk(k) + '<span class="ck-key">' + k + '</span></label>'
          + '<textarea data-ck-edit="'+escAttr(k)+'">' + escHtml(val) + '</textarea></div>';
      });
      html += '</div>';
    }

    html += '<div id="list-items"></div>';
    html += '<button type="button" class="btn btn-ghost" id="list-item-add" style="margin:4px 0 16px">+ ახალი ' + cfg.label + '</button>';
    html += saveBarHtml();
    main.innerHTML = html;
    wireContentLangToggle(main, tab);

    function itemCardHtml(id, idx){
      var title = listItemFieldVal(page, id, 'title');
      var fieldsHtml = cfg.fields.map(function(f){
        var ck = page + '.' + id + '.' + f.key;
        var val = listItemFieldVal(page, id, f.key);
        return '<div class="field-block"><label>' + f.label + '<span class="ck-key">' + ck + '</span></label>'
          + '<textarea data-list-field="'+f.key+'" data-list-id="'+escAttr(id)+'">' + escHtml(val) + '</textarea></div>';
      }).join('');
      return '<div class="card" data-list-card="'+escAttr(id)+'">'
        + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">'
          + '<h3 style="margin:0;font-family:var(--font-display);font-size:1.02rem" data-list-title>' + (idx+1) + '. ' + (escHtml(title) || cfg.label) + '</h3>'
          + '<button type="button" class="drag-eye" data-list-delete="'+escAttr(id)+'" title="წაშლა">🗑</button>'
        + '</div>'
        + fieldsHtml
        + '</div>';
    }

    function renderItems(){
      var ids = listOrderFor(page);
      document.getElementById('list-items').innerHTML = ids.map(itemCardHtml).join('');
      wireItems(ids);
    }

    function wireItems(ids){
      main.querySelectorAll('[data-list-field]').forEach(function(ta){
        ta.addEventListener('input', function(){
          var id = ta.getAttribute('data-list-id'), field = ta.getAttribute('data-list-field');
          ckStore()[page + '.' + id + '.' + field] = ta.value;
          setDirty(tab, true);
          updateStatusChip(tab);
          if(field === 'title'){
            var idx = ids.indexOf(id);
            ta.closest('.card').querySelector('[data-list-title]').textContent = (idx+1) + '. ' + (ta.value || cfg.label);
          }
        });
      });
      main.querySelectorAll('[data-list-delete]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-list-delete');
          var current = listOrderFor(page);
          if(current.length <= 1){ alert('ბოლო ჩანაწერის წაშლა შეუძლებელია.'); return; }
          if(!confirm('წავშალო ეს ' + cfg.label + '? საიტზეც გაქრება.')) return;
          saveListOrder(page, current.filter(function(x){ return x !== id; }));
          // delete both languages' text for this item — the item itself is
          // gone (shared __order), not just its currently-viewed translation
          cfg.fields.forEach(function(f){ delete state.content[page + '.' + id + '.' + f.key]; delete state.contentEn[page + '.' + id + '.' + f.key]; });
          setDirty(tab, true);
          updateStatusChip(tab);
          renderItems();
        });
      });
    }

    main.querySelectorAll('[data-ck-edit]').forEach(function(ta){
      ta.addEventListener('input', function(){
        ckStore()[ta.getAttribute('data-ck-edit')] = ta.value;
        setDirty(tab, true);
        updateStatusChip(tab);
      });
    });

    renderItems();

    document.getElementById('list-item-add').addEventListener('click', function(){
      var id = nextListId(page);
      saveListOrder(page, listOrderFor(page).concat([id]));
      setDirty(tab, true);
      updateStatusChip(tab);
      renderItems();
      var card = main.querySelector('[data-list-card="'+id+'"]');
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    });

    wireSaveBar(tab, function(){ return contentLang === 'en' ? {path:'content-site-en', body: state.contentEn} : {path:'content-site', body: state.content}; });
  }

  function renderContentPanel(main, tab){
    var keys = CONTENT_ORDER.filter(function(k){ return parseCk(k).page === tab.page; });
    var html = panelHeadHtml(tab, 'შეცვალეთ ტექსტი და დააჭირეთ „ცვლილებების შენახვას“. მარტივი HTML ტეგები (em, strong, br) დაშვებულია და შენარჩუნდება საიტზე.');
    html += contentLangToggleHtml();

    // Group the page's fields by segment (row1, card2, stat1, s1…) in the
    // order they appear — each segment becomes its own sub-tab instead of
    // one long stacked list, so a page like "services" (7 segments) shows
    // only the selected one's 2-3 fields at a time instead of all ~20.
    var segOrder = [], segKeys = {};
    keys.forEach(function(k){
      var sub = parseCk(k).sub || '__general__';
      if(!segKeys[sub]){ segKeys[sub] = []; segOrder.push(sub); }
      segKeys[sub].push(k);
    });
    var useSubTabs = segOrder.length > 1;
    if(useSubTabs && (!contentSubTab[tab.page] || !segKeys[contentSubTab[tab.page]])){
      contentSubTab[tab.page] = segOrder[0];
    }
    var activeSub = useSubTabs ? contentSubTab[tab.page] : segOrder[0];

    if(useSubTabs){
      html += '<div class="bg-type-row" style="flex-wrap:wrap;gap:8px">' + segOrder.map(function(sub){
        var label = sub === '__general__' ? 'ზოგადი' : humanizeSegment(sub);
        return '<button type="button" class="bg-type-btn'+(sub===activeSub?' is-active':'')+'" data-content-subtab="'+sub+'" style="flex:0 1 auto">'+label+'</button>';
      }).join('') + '</div>';
    }

    html += '<div class="card">';
    if(useSubTabs && activeSub !== '__general__') html += '<div class="seg-label" style="margin-top:0">' + humanizeSegment(activeSub) + '</div>';
    (segKeys[activeSub] || []).forEach(function(k){
      var val = contentValFor(k);
      html += '<div class="field-block">'
        + '<label>' + labelForCk(k) + '<span class="ck-key">' + k + '</span></label>'
        + '<textarea data-ck-edit="'+escAttr(k)+'">' + escHtml(val) + '</textarea>'
        + '</div>';
      if(SVC_TILE_IMAGE_MAP[k]) html += renderSvcPhotoField(SVC_TILE_IMAGE_MAP[k]);
    });
    html += '</div>';
    html += saveBarHtml();
    main.innerHTML = html;
    wireContentLangToggle(main, tab);

    main.querySelectorAll('[data-content-subtab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        contentSubTab[tab.page] = btn.getAttribute('data-content-subtab');
        renderContentPanel(main, tab);
      });
    });

    main.querySelectorAll('[data-ck-edit]').forEach(function(ta){
      ta.addEventListener('input', function(){
        ckStore()[ta.getAttribute('data-ck-edit')] = ta.value;
        setDirty(tab, true);
        updateStatusChip(tab);
      });
    });

    function refreshSvcPhotoCell(imgKey){
      var cell = main.querySelector('[data-svc-photo-cell="'+imgKey+'"]');
      if(!cell) return;
      var val = state.content[imgKey];
      cell.innerHTML = (val ? '<img class="part-thumb" src="'+val+'" alt="">' : '<div class="part-thumb-empty">—</div>')
        + '<div class="part-photo-actions">'
          + '<label>ატვირთვა<input type="file" accept="image/*" data-svc-photo></label>'
          + (val ? '<button type="button" data-svc-photo-clear>წაშლა</button>' : '')
        + '</div>';
      wireSvcPhotoCell(imgKey);
    }
    function wireSvcPhotoCell(imgKey){
      var cell = main.querySelector('[data-svc-photo-cell="'+imgKey+'"]');
      if(!cell) return;
      var fileInp = cell.querySelector('[data-svc-photo]');
      if(fileInp){
        fileInp.addEventListener('change', function(){
          var file = fileInp.files && fileInp.files[0];

          var reader = new FileReader();
          reader.onload = function(){
            var img = new Image();
            img.onload = function(){
              var scale = Math.min(1, SVC_PHOTO_MAX_W / img.width);
              var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              state.content[imgKey] = canvas.toDataURL('image/jpeg', SVC_PHOTO_QUALITY);
              setDirty(tab, true);
              updateStatusChip(tab);
              refreshSvcPhotoCell(imgKey);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      var clearBtn = cell.querySelector('[data-svc-photo-clear]');

        clearBtn.addEventListener('click', function(){
          delete state.content[imgKey];
          setDirty(tab, true);
          updateStatusChip(tab);
          refreshSvcPhotoCell(imgKey);
        });
      }
    }

  // if present and valid, filtered to known items and with any new item

  function orderedNavItems(){
    var saved = Array.isArray(state.theme.navOrder) ? state.theme.navOrder : null;

                refreshCell();

              img.src = reader.result;
            };
            reader.readAsDataURL(file);
          });
        }
        var clearBtn = cell.querySelector('[data-'+prefix+'-photo-clear]');
        if(clearBtn){
          clearBtn.addEventListener('click', function(){
            delete state.theme[photoKey];
            setDirty(tab, true);
            updateStatusChip(tab);
            refreshCell();
          });

      wireCell();
    }
    function wireBgTypeVideo(prefix, videoKey){

        var cell = main.querySelector('[data-'+prefix+'-video-cell]');

        cell.innerHTML = '<div class="part-thumb-empty" style="font-size:.72rem;text-align:center;padding:6px;line-height:1.4">'+formatVideoInfo(val)+'</div>'
          + '<div class="part-photo-actions">'
            + '<label>ატვირთვა<input type="file" accept="video/*" data-'+prefix+'-video-upload></label>'
            + (val ? '<button type="button" data-'+prefix+'-video-clear>ნაგულისხმევზე დაბრუნება</button>' : '')
          + '</div>';
        wireCell();
      }
      function wireCell(){
        var cell = main.querySelector('[data-'+prefix+'-video-cell]');
        if(!cell) return;
        var fileInp = cell.querySelector('[data-'+prefix+'-video-upload]');
        if(fileInp){

              fileInp.value = '';
              return;
            }
            var reader = new FileReader();
            reader.onload = function(){
              state.theme[videoKey] = reader.result;
              setDirty(tab, true);
              updateStatusChip(tab);
              refreshCell();
            };
            reader.readAsDataURL(file);
          });
        }
        var clearBtn = cell.querySelector('[data-'+prefix+'-video-clear]');
        if(clearBtn){
          clearBtn.addEventListener('click', function(){
            delete state.theme[videoKey];
            setDirty(tab, true);
            updateStatusChip(tab);
            refreshCell();
          });
        }
      }
      wireCell();
    }
    wireBgTypePhoto('herobg', 'heroBgType', 'heroBgPhoto');
    wireBgTypeVideo('herobg', 'heroBgVideo');
    wireBgTypePhoto('craftbg', 'craftBgType', 'craftBgPhoto');
    wireBgTypeVideo('craftbg', 'craftBgVideo');

    main.querySelectorAll('[data-craft-align-v]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.theme.craftAlignV = btn.getAttribute('data-craft-align-v');
        state.theme.craftAlignH = btn.getAttribute('data-craft-align-h');
        setDirty(tab, true);
        updateStatusChip(tab);
        main.querySelectorAll('[data-craft-align-v]').forEach(function(b){ b.classList.toggle('is-active', b===btn); });
      });
    });

    var heightInp = main.querySelector('[data-herobg-height]');
    if(heightInp){
      heightInp.addEventListener('input', function(){
        var v = Number(heightInp.value) || 0;
        state.theme.heroMinHeight = v;
        setDirty(tab, true);
        var ro = main.querySelector('[data-herobg-height-readout]');
        if(ro) ro.textContent = v ? v+'vh' : 'ავტომატური';
        updateStatusChip(tab);
      });
    }

    /* ---- drag position + visibility ---- */
    function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
    main.querySelectorAll('[data-drag-chip]').forEach(function(chip){
      var xKey = chip.getAttribute('data-pos-x'), yKey = chip.getAttribute('data-pos-y');
      var baseLeft = Number(chip.getAttribute('data-base-left'));
      var baseTop = Number(chip.getAttribute('data-base-top'));
      var dragging = false, startPX = 0, startPY = 0, startX = 0, startY = 0;
      chip.addEventListener('pointerdown', function(e){
        if(e.target.closest('.drag-eye')) return;
        dragging = true;
        try{ chip.setPointerCapture(e.pointerId); }catch(err){}
        startPX = e.clientX; startPY = e.clientY;
        startX = Number(state.theme[xKey]) || 0;
        startY = Number(state.theme[yKey]) || 0;
        chip.classList.add('is-dragging');
      });
      chip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var dx = clamp(startX + (e.clientX - startPX), -DRAG_CLAMP_X, DRAG_CLAMP_X);
        var dy = clamp(startY + (e.clientY - startPY), -DRAG_CLAMP_Y, DRAG_CLAMP_Y);
        state.theme[xKey] = dx; state.theme[yKey] = dy;
        chip.style.left = (baseLeft + dx) + 'px';
        chip.style.top = (baseTop + dy) + 'px';
      });
      function endDrag(){
        if(!dragging) return;
        dragging = false;
        chip.classList.remove('is-dragging');
        setDirty(tab, true);
        updateStatusChip(tab);
      }
      chip.addEventListener('pointerup', endDrag);
      chip.addEventListener('pointercancel', endDrag);
    });
    main.querySelectorAll('[data-drag-hidden-key]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var key = btn.getAttribute('data-drag-hidden-key');
        state.theme[key] = !state.theme[key];
        setDirty(tab, true);
        updateStatusChip(tab);
        renderMain();
      });
    });

    wireSaveBar(tab, function(){ return {path:'theme-site', body: state.theme}; });
  }

  function partsIdList(){

  function partsFieldVal(id, key){
    var def = PARTS_DEFAULTS.find(function(d){ return d.id === id; }) || {};

  var PARTS_XLSX_COL_MAP = {
    id:'id', 'იდი':'id',
    name:'name', 'დასახელება':'name',
    price:'price', 'ფასი':'price', 'ფასი ₾':'price',
    stock:'stock', 'მარაგი':'stock',
    qty:'qty', quantity:'qty', 'რაოდენობა':'qty',
    brand:'brand', 'ბრენდი':'brand',
    cat:'cat', 'ტიპი':'cat', 'ნაწილის ტიპი':'cat', category:'cat',
    device:'device', 'მოწყობილობა':'device', 'მოწყობილობის ტიპი':'device',
    compat:'compat', 'თავსებადობა':'compat', compatibility:'compat'
  };
  function partsXlsxNormStock(v){
    v = String(v||'').trim().toLowerCase();
    if(v === 'low' || v === 'მცირდება') return 'low';
    return 'in';
  }
  function partsXlsxRowsToParts(rows){
    var out = [];
    rows.forEach(function(row){
      var rec = {};
      Object.keys(row).forEach(function(k){
        var norm = PARTS_XLSX_COL_MAP[String(k).trim().toLowerCase()];
        if(norm) rec[norm] = row[k];
      });
      if(!rec.name && !rec.id) return;
      rec.stock = partsXlsxNormStock(rec.stock);
      out.push(rec);
    });
    return out;
  }

    function filteredPartsIdList(){

    function wireList(){

    function wirePhotoCell(id){
      var cell = main.querySelector('[data-part-photo-cell="'+id+'"]');
      if(!cell) return;
      var fileInp = cell.querySelector('[data-parts-photo="'+id+'"]');
      if(fileInp){
        fileInp.addEventListener('change', function(){
          var file = fileInp.files && fileInp.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(){
            var img = new Image();
            img.onload = function(){
              var scale = Math.min(1, PART_PHOTO_MAX_W / img.width);
              var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              var dataUrl = canvas.toDataURL('image/jpeg', PART_PHOTO_QUALITY);
              if(!state.parts[id]) state.parts[id] = {};
              state.parts[id].image = dataUrl;
              setDirty(tab, true);
              updateStatusChip(tab);
              refreshPhotoCell(id);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });

      var clearBtn = cell.querySelector('[data-parts-photo-clear="'+id+'"]');

      var file = inp.files && inp.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var recs;
        try{
          var wb = XLSX.read(reader.result, {type:'array'});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          recs = partsXlsxRowsToParts(XLSX.utils.sheet_to_json(sheet, {defval:''}));
        }catch(e){
          alert('ფაილის წაკითხვა ვერ მოხერხდა — შეამოწმეთ ფორმატი (.xlsx ან .csv).');
          inp.value = '';
          return;
        }
        if(!recs.length){ alert('ფაილში ვერცერთი ნაწილი ვერ მოიძებნა.'); inp.value = ''; return; }
        if(!confirm('ფაილში ნაპოვნია ' + recs.length + ' ნაწილი. დავამატო/განვაახლო კატალოგში?')){ inp.value = ''; return; }
        recs.forEach(function(rec, i){
          var id = rec.id && String(rec.id).trim() ? String(rec.id).trim() : ('custom-' + Date.now() + '-' + i);
          delete rec.id;
          var existing = state.parts[id] || {};
          state.parts[id] = Object.assign({}, existing, rec);
        });
        setDirty(tab, true);
        updateStatusChip(tab);
        renderList();
        inp.value = '';
      };
      reader.readAsArrayBuffer(file);
    });

    wireSaveBar(tab, function(){ return {path:'content-parts', body: state.parts}; });
  }

  var BK_DEFAULT_DEVICES = [['სმარტფონი','Smartphone'],['ლეპტოპი / კომპიუტერი','Laptop / computer'],['პლანშეტი','Tablet'],['სმარტ-საათი','Smartwatch'],['სათამაშო კონსოლი','Game console'],['საყოფაცხოვრებო ტექნიკა','Home appliance']];
  var BK_DEFAULT_ISSUES = [['ეკრანის დაზიანება','Screen damage'],['ბატარეა ვერ იტენება',"Battery won't charge"],['წყლის დაზიანება','Water damage'],['არ ირთვება',"Won't turn on"],['სხვა','Other']];
  function bkId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function defaultBookingOptions(){
    return { devices: BK_DEFAULT_DEVICES.map(function(d,i){
      return { id:'d'+(i+1), name:d[0], nameEn:d[1], enabled:true,

        + '<div class="field-block" style="flex:1;min-width:130px;margin:0"><input type="text" data-bko-dev-field="nameEn" data-bko-id="'+escAttr(d.id)+'" value="'+escAttr(d.nameEn||'')+'" placeholder="English name"></div>'

        + '<button type="button" class="drag-eye" data-bko-dev-del="'+escAttr(d.id)+'" title="მოწყობილობის წაშლა">🗑</button>'
        + '</div>';
      if(isOpen){
        html += '<div style="padding:12px 14px">';
        if(!issues.length) html += '<p style="font-size:.82rem;color:var(--ink-faint);margin:0 0 10px">ამ მოწყობილობას პრობლემები ჯერ არ აქვს.</p>';
        issues.forEach(function(x, xi){
          html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;'+(x.enabled===false?'opacity:.55':'')+'">'

            + '<input type="checkbox" title="ჩართულია" data-bko-iss-on="'+escAttr(d.id)+'|'+escAttr(x.id)+'"'+(x.enabled!==false?' checked':'')+'>'

    main.innerHTML = html;

    function devOf(id){ return opts.devices.find(function(d){ return d.id === id; }); }
    function issOf(pair){ var a = pair.split('|'); var d = devOf(a[0]); return {d:d, x: d && (d.issues||[]).find(function(x){ return x.id === a[1]; })}; }
    function changed(){ setDirty(tab, true); updateStatusChip(tab); }
    function rerender(){ renderBookingOptionsPanel(main, tab); }
    function swap(arr, i, j){ if(i<0 || j<0 || i>=arr.length || j>=arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

    main.querySelectorAll('input[type=text][data-bko-id]').forEach(function(inp){

        var id = inp.getAttribute('data-bko-id');

        else { var r = issOf(id); if(r.x) r.x[inp.getAttribute('data-bko-iss-field')] = inp.value; }
        changed();
      });
    });
    main.querySelectorAll('input[type=checkbox][data-bko-dev-on], input[type=checkbox][data-bko-iss-on]').forEach(function(t){
      t.addEventListener('change', function(){
        if(t.hasAttribute('data-bko-dev-on')){ var d = devOf(t.getAttribute('data-bko-dev-on')); if(d){ d.enabled = t.checked; changed(); rerender(); } }
        else { var r = issOf(t.getAttribute('data-bko-iss-on')); if(r.x){ r.x.enabled = t.checked; changed(); rerender(); } }
      });
    });
    main.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var a;
        if((a = btn.getAttribute('data-bko-fold'))){ open[a] = !open[a]; rerender(); }
        else if((a = btn.getAttribute('data-bko-dev-up'))){ var i = opts.devices.findIndex(function(d){ return d.id===a; }); swap(opts.devices, i, i-1); changed(); rerender(); }
        else if((a = btn.getAttribute('data-bko-dev-down'))){ var i2 = opts.devices.findIndex(function(d){ return d.id===a; }); swap(opts.devices, i2, i2+1); changed(); rerender(); }
        else if((a = btn.getAttribute('data-bko-dev-del'))){
          var dd = devOf(a); if(!dd) return;
          if(!confirm('წავშალო მოწყობილობა „' + (dd.name||'') + '“ და მისი ' + (dd.issues||[]).length + ' პრობლემა?')) return;
          opts.devices = opts.devices.filter(function(d){ return d.id !== a; }); changed(); rerender();
        }
        else if((a = btn.getAttribute('data-bko-iss-add'))){ var d3 = devOf(a); if(d3){ (d3.issues = d3.issues || []).push({id:bkId('i'), name:'', nameEn:'', enabled:true}); open[a] = true; changed(); rerender(); } }
        else if((a = btn.getAttribute('data-bko-iss-del'))){ var r2 = issOf(a); if(r2.d){ r2.d.issues = r2.d.issues.filter(function(x){ return x !== r2.x; }); changed(); rerender(); } }
        else if((a = btn.getAttribute('data-bko-iss-up'))){ var r3 = issOf(a); if(r3.x){ var k = r3.d.issues.indexOf(r3.x); swap(r3.d.issues, k, k-1); changed(); rerender(); } }
        else if((a = btn.getAttribute('data-bko-iss-down'))){ var r4 = issOf(a); if(r4.x){ var k2 = r4.d.issues.indexOf(r4.x); swap(r4.d.issues, k2, k2+1); changed(); rerender(); } }
      });
    });
    var addDev = document.getElementById('bko-add-device');
    if(addDev) addDev.addEventListener('click', function(){
      var nd = {id:bkId('d'), name:'', nameEn:'', enabled:true, issues:[]};
      opts.devices.push(nd); open[nd.id] = true; changed(); rerender();
    });
    wireSaveBar(tab, function(){
      // never publish blank names — an empty device/issue can't be picked anyway
      var clean = { devices: opts.devices.filter(function(d){ return (d.name||'').trim(); }).map(function(d){
        return { id:d.id, name:d.name.trim(), nameEn:(d.nameEn||'').trim(), enabled:d.enabled!==false,
          issues:(d.issues||[]).filter(function(x){ return (x.name||'').trim(); }).map(function(x){ return {id:x.id, name:x.name.trim(), nameEn:(x.nameEn||'').trim(), enabled:x.enabled!==false}; }) };
      }) };
      return {path:'bookingOptions', body: clean};
    });
  }

  function renderWarrantyPanel(main, tab){

  function renderWarrantyRecordsSubpanel(tab){
    var host = document.getElementById('warranty-subpanel');
    if(!host) return;
    var serials = Object.keys(state.warranty).sort();
    var html = '<p class="field-hint" style="margin-bottom:10px">თუ ტელეფონს შეავსებთ, საიტზე ამ ჩანაწერის გადამოწმებისას მომხმარებელს მოეთხოვება იმავე ნომრის დადასტურება SMS-კოდით — ცარიელი ტელეფონის შემთხვევაში ჩანაწერი კვლავ დაუყოვნებლივ გამოჩნდება, ისე როგორც აქამდე.</p>';
    html += '<div class="card"><table class="admin-table"><thead><tr>'
      + '<th style="width:150px">სერიული №</th><th>მომხმარებელი</th><th style="width:150px">ტელეფონი</th><th style="width:130px">პირადი №</th><th>მოწყობილობა</th><th>კატეგორია</th><th style="width:120px">შეძენა</th><th style="width:120px">ვადა</th><th style="width:34px"></th>'
      + '</tr></thead><tbody id="warranty-records-tbody">'
      + serials.map(function(s){ return warrantyRecordRowHtml(s, state.warranty[s]); }).join('')
      + '</tbody></table>'
      + '<button type="button" class="btn btn-ghost" id="warranty-add-record" style="margin-top:16px">+ ახალი ჩანაწერი</button>'
      + '</div>';
    html += warrantySaveBarHtml('ბოლო შენახულის დაბრუნება');
    host.innerHTML = html;

    host.querySelectorAll('[data-warranty-row]').forEach(function(row){
      var serial = row.getAttribute('data-warranty-row');
      row.querySelectorAll('[data-warranty-field]').forEach(function(inp){
        inp.addEventListener('input', function(){
          var field = inp.getAttribute('data-warranty-field');
          if(field === 'serial'){
            var newSerial = inp.value.trim().toUpperCase();
            if(newSerial && newSerial !== serial && !state.warranty[newSerial]){
              state.warranty[newSerial] = state.warranty[serial];
              delete state.warranty[serial];
              row.setAttribute('data-warranty-row', newSerial);
              serial = newSerial;
            }
          } else {
            if(!state.warranty[serial]) state.warranty[serial] = {};
            state.warranty[serial][field] = inp.value;
          }
          dirty.warrantyRecords = true;
        });
      });
      var delBtn = row.querySelector('[data-warranty-delete]');
      if(delBtn) delBtn.addEventListener('click', function(){
        if(!confirm('წავშალო ეს ჩანაწერი?')) return;
        delete state.warranty[serial];
        dirty.warrantyRecords = true;
        renderWarrantyRecordsSubpanel(tab);
      });
    });

    document.getElementById('warranty-add-record').addEventListener('click', function(){
      var serial = prompt('სერიული ნომერი (მაგ. TL-000000-GE):');
      if(!serial) return;
      serial = serial.trim().toUpperCase();
      if(!serial) return;
      if(state.warranty[serial]){ toast('ეს სერიული ნომერი უკვე არსებობს'); return; }
      state.warranty[serial] = {customerName:'', phone:'', personalId:'', device:'', cat:'', purchase:'', end:''};
      dirty.warrantyRecords = true;
      renderWarrantyRecordsSubpanel(tab);

      saveBtn.disabled = true; saveBtn.textContent = 'ინახება…';
      apiPut('/api/site/warranty', state.warranty).then(function(){
        dirty.warrantyRecords = false;
        toast('ცვლილებები შენახულია');
      }).catch(function(err){
        toast(err && err.status === 401 ? 'ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ' : 'შენახვა ვერ მოხერხდა');
        if(err && err.status === 401) document.getElementById('logout-btn').click();
      }).finally(function(){
        saveBtn.disabled = false; saveBtn.textContent = 'ცვლილებების შენახვა';
      });
    });
    resetBtn.addEventListener('click', function(){
      if(!confirm('ბოლო შენახული მდგომარეობა ხელახლა ჩამოიტვირთოს? შეუნახავი ცვლილებები დაიკარგება.')) return;
      apiGet('/api/site/warranty').then(function(d){
        state.warranty = d || {};
        dirty.warrantyRecords = false;
        renderWarrantyRecordsSubpanel(tab);
      });
    });

  // Cache of the single extracted page currently shown in the field editor
  // (see extractTemplatePage on the backend for why one page at a time):
  // {pdf, page, pageCount, width, height}. Cleared whenever a new file is
  // uploaded or the shown page changes, and refetched from the server.
  var warrantyPagePreview = null;
  // Which page is currently being BROWSED in the editor — deliberately kept
  // separate from state.warrantyTemplate.page (the page fields actually get
  // saved against). Earlier these were the same variable, so simply paging
  // through the document to see what was in it silently re-targeted every
  // page you looked at — the chips seemed to "follow you" onto every page.
  // Now browsing never moves the target; only the explicit "choose this
  // page" button below does.
  var warrantyViewedPage = null;
  function loadWarrantyPagePreview(tab, page){
    var t = state.warrantyTemplate || {};
    if(!t.pdf) return;
    var host = document.getElementById('warranty-subpanel');
    apiPost('/api/warranty-template/page', {pdf: t.pdf, page: page}).then(function(r){
      warrantyPagePreview = r;
      warrantyViewedPage = r.page;
      renderWarrantyTemplateSubpanel(tab);

          + '<iframe src="'+escAttr(pv.pdf)+'#toolbar=0&navpanes=0" style="width:100%;height:100%;border:none;pointer-events:none" title="შაბლონის გადახედვა"></iframe>';
        if(isTargetPage){

          html += '<div class="drag-chip" data-warranty-table-chip style="position:absolute;left:'+table.xPct+'%;top:'+table.yPct+'%;width:'+table.widthPct+'%;height:'+tableHPct+'%;padding:0;overflow:visible;border-radius:6px;flex-direction:column;align-items:stretch;background:none;backdrop-filter:none;border:1.5px solid '+escAttr(table.headerColor||'#0E4F8E')+'">'
            + '<div style="background:'+escAttr(table.headerColor||'#0E4F8E')+';color:'+escAttr(table.headerTextColor||'#FFFFFF')+';font-size:10px;font-weight:700;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px 5px 0 0">'+escHtml(table.title||'საგარანტიო ინფორმაცია')+'</div>'
            + '<div style="background:#FFFFFF;flex:1;font-size:8.5px;line-height:1.5;color:#334;padding:3px 6px;overflow:hidden;border-radius:0 0 5px 5px">'

            + '</div>';

        html += '</div>';
        if(isTargetPage){
          html += '<p class="field-hint" style="margin-top:10px;color:var(--good,#237A4C)">✓ მომხმარებლის მონაცემები დაიბეჭდება ამ გვერდზე</p>';
        } else {
          html += '<button type="button" class="btn btn-gold" id="warranty-page-choose" style="margin-top:10px;width:100%">ამ გვერდის არჩევა ველების დასასმელად</button>';

      html += '</div>';

      html += '<div class="seg-label">ცხრილის გაფორმება</div>';
      html += '<div class="field-block">'
        + '<label>სათაური</label>'
        + '<input type="text" id="warranty-table-title" value="'+escAttr(table.title||'')+'" placeholder="საგარანტიო ინფორმაცია">'
        + '</div>';
      html += '<div class="part-photo-actions" style="flex-direction:row;gap:14px">'
        + '<div class="field-block" style="flex:1"><label>ჰედერის ფერი</label><input type="color" id="warranty-table-header-color" value="'+escAttr(table.headerColor||'#0E4F8E')+'" style="width:100%;height:38px;padding:2px"></div>'
        + '<div class="field-block" style="flex:1"><label>ტექსტის ფერი</label><input type="color" id="warranty-table-header-text-color" value="'+escAttr(table.headerTextColor||'#FFFFFF')+'" style="width:100%;height:38px;padding:2px"></div>'
        + '</div>';
      html += '<div class="field-block">'
        + '<label>სიგანე<span class="ck-key" data-warranty-table-readout="widthPct">'+(table.widthPct||85)+'%</span></label>'
        + '<input type="range" id="warranty-table-width" min="30" max="95" step="1" value="'+(table.widthPct||85)+'" style="width:100%">'
        + '</div>';
      html += '<div class="field-block">'
        + '<label>ტექსტის ზომა<span class="ck-key" data-warranty-table-readout="fontSize">'+(table.fontSize||11)+'pt</span></label>'
        + '<input type="range" id="warranty-table-font-size" min="7" max="20" step="1" value="'+(table.fontSize||11)+'" style="width:100%">'
        + '</div>';

      html += '<button type="button" class="btn btn-ghost" id="warranty-pdf-test" style="margin-top:6px">სატესტო ბარათის გახსნა</button>'
        + '<p class="field-hint" style="margin-top:6px">ტესტი ჯერ ინახავს შაბლონს, შემდეგ ხსნის ნიმუშ-ბარათს ახალ ჩანართში.</p>';
    }
    html += '</div>';
    html += warrantySaveBarHtml('ბოლო შენახულის დაბრუნება');
    host.innerHTML = html;

    if(hasPdf && (!warrantyPagePreview || warrantyPagePreview.page !== warrantyViewedPage)){
      loadWarrantyPagePreview(tab, warrantyViewedPage);
    }

    var prevPageBtn = document.getElementById('warranty-page-prev');
    if(prevPageBtn) prevPageBtn.addEventListener('click', function(){
      var target = (warrantyViewedPage || 1) - 1;
      if(target < 1) return;
      warrantyViewedPage = target;
      renderWarrantyTemplateSubpanel(tab);
    });
    var nextPageBtn = document.getElementById('warranty-page-next');
    if(nextPageBtn) nextPageBtn.addEventListener('click', function(){
      var max = warrantyPagePreview ? warrantyPagePreview.pageCount : 1;
      var target = (warrantyViewedPage || 1) + 1;
      if(target > max) return;
      warrantyViewedPage = target;
      renderWarrantyTemplateSubpanel(tab);
    });
    var choosePageBtn = document.getElementById('warranty-page-choose');
    if(choosePageBtn) choosePageBtn.addEventListener('click', function(){
      state.warrantyTemplate.page = warrantyViewedPage;
      dirty.warrantyTemplate = true;
      renderWarrantyTemplateSubpanel(tab);
    });

    var fileInp = document.getElementById('warranty-pdf-upload');
    if(fileInp) fileInp.addEventListener('change', function(){
      var file = fileInp.files && fileInp.files[0];
      if(!file) return;
      if(file.type !== 'application/pdf'){ toast('მხოლოდ PDF ფაილია დაშვებული'); return; }
      if(file.size > WARRANTY_PDF_MAX_BYTES){ toast('ფაილი ძალიან დიდია (მაქს. 8MB)'); return; }
      var reader = new FileReader();
      reader.onload = function(){
        var prevTable = (state.warrantyTemplate && state.warrantyTemplate.table) || Object.assign({}, WARRANTY_TABLE_DEFAULTS);
        state.warrantyTemplate = { pdf: reader.result, page: 1, table: prevTable };
        warrantyPagePreview = null;
        warrantyViewedPage = null;
        dirty.warrantyTemplate = true;
        renderWarrantyTemplateSubpanel(tab);
      };
      reader.readAsDataURL(file);
    });

    var clearBtn = document.getElementById('warranty-pdf-clear');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      if(!confirm('წავშალო ატვირთული შაბლონი? ბარათი დაბრუნდება ჩაშენებულ დიზაინზე.')) return;
      state.warrantyTemplate = {};
      warrantyPagePreview = null;
      warrantyViewedPage = null;
      dirty.warrantyTemplate = true;
      renderWarrantyTemplateSubpanel(tab);
    });

    function clampPct(n){ return Math.max(0, Math.min(100, n)); }
    function ensureTable(){
      if(!state.warrantyTemplate.table) state.warrantyTemplate.table = Object.assign({}, WARRANTY_TABLE_DEFAULTS);
      return state.warrantyTemplate.table;
    }
    var previewEl = document.getElementById('warranty-pdf-preview');
    var tableChip = previewEl ? previewEl.querySelector('[data-warranty-table-chip]') : null;
    if(tableChip){
      var dragging = false;
      tableChip.addEventListener('pointerdown', function(e){
        if(e.target.closest('[data-warranty-table-resize]')) return; // handled separately below
        dragging = true;
        try{ tableChip.setPointerCapture(e.pointerId); }catch(err){}
        tableChip.classList.add('is-dragging');
      });
      tableChip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var rect = previewEl.getBoundingClientRect();
        var xPct = Math.round(clampPct(((e.clientX - rect.left) / rect.width) * 100) * 10) / 10;
        var yPct = Math.round(clampPct(((e.clientY - rect.top) / rect.height) * 100) * 10) / 10;
        var table = ensureTable();
        table.xPct = xPct;
        table.yPct = yPct;
        tableChip.style.left = xPct+'%';
        tableChip.style.top = yPct+'%';
      });
      function endDrag(){
        if(!dragging) return;
        dragging = false;
        tableChip.classList.remove('is-dragging');
        dirty.warrantyTemplate = true;
      }
      tableChip.addEventListener('pointerup', endDrag);
      tableChip.addEventListener('pointercancel', endDrag);

      // Corner handle: drag to resize (width + font size, which together
      // determine the table's printed height) instead of only the sliders —
      // staff asked to be able to grab the frame and grow/shrink it directly.
      var resizeHandle = tableChip.querySelector('[data-warranty-table-resize]');
      if(resizeHandle){
        var resizing = false, rStartX = 0, rStartY = 0, rStartWidthPx = 0, rStartFontSize = 11;
        resizeHandle.addEventListener('pointerdown', function(e){
          e.stopPropagation();
          resizing = true;
          try{ resizeHandle.setPointerCapture(e.pointerId); }catch(err){}
          var chipRect = tableChip.getBoundingClientRect();
          rStartX = e.clientX; rStartY = e.clientY;
          rStartWidthPx = chipRect.width;
          rStartFontSize = Number(ensureTable().fontSize) || 11;
          tableChip.classList.add('is-dragging');
        });
        resizeHandle.addEventListener('pointermove', function(e){
          if(!resizing) return;
          e.stopPropagation();
          var previewRect = previewEl.getBoundingClientRect();
          var table = ensureTable();

          var newWidthPx = Math.max(60, rStartWidthPx + (e.clientX - rStartX));
          var widthPct = Math.round(clampPct(newWidthPx / previewRect.width * 100));
          widthPct = Math.max(30, Math.min(95, widthPct));
          table.widthPct = widthPct;

          // Printed height is derived from fontSize (header + 5 rows all
          // scale with it), so "growing the box" vertically means solving
          // for the fontSize whose computed height matches the drag — the
          // inverse of warrantyTableHeightPct's own formula (totalPt =
          // fontSize * 12.8 for a header + 5 rows).
          if(warrantyPagePreview && warrantyPagePreview.height){
            var pageHeightPt = warrantyPagePreview.height;
            var rStartHeightPx = (rStartFontSize * 12.8) / pageHeightPt * previewRect.height;
            var newHeightPx = Math.max(40, rStartHeightPx + (e.clientY - rStartY));
            var heightPct = clampPct(newHeightPx / previewRect.height * 100);
            var fontSize = Math.round(Math.max(7, Math.min(20, heightPct * pageHeightPt / (100 * 12.8))));
            table.fontSize = fontSize;
          }

          tableChip.style.width = table.widthPct + '%';
          tableChip.style.height = warrantyTableHeightPct(table, warrantyPagePreview ? warrantyPagePreview.height : 0) + '%';

          var widthInpLive = document.getElementById('warranty-table-width');
          if(widthInpLive){
            widthInpLive.value = table.widthPct;
            var wro = host.querySelector('[data-warranty-table-readout="widthPct"]');
            if(wro) wro.textContent = table.widthPct + '%';
          }
          var fontInpLive = document.getElementById('warranty-table-font-size');
          if(fontInpLive){
            fontInpLive.value = table.fontSize;
            var fro = host.querySelector('[data-warranty-table-readout="fontSize"]');
            if(fro) fro.textContent = table.fontSize + 'pt';
          }
        });
        function endResize(){
          if(!resizing) return;
          resizing = false;
          tableChip.classList.remove('is-dragging');
          dirty.warrantyTemplate = true;
        }
        resizeHandle.addEventListener('pointerup', endResize);
        resizeHandle.addEventListener('pointercancel', endResize);
      }
    }

    var titleInp = document.getElementById('warranty-table-title');
    if(titleInp) titleInp.addEventListener('input', function(){
      ensureTable().title = titleInp.value;
      dirty.warrantyTemplate = true;
      var chipTitle = tableChip && tableChip.querySelector('div:first-child');
      if(chipTitle) chipTitle.textContent = titleInp.value || 'საგარანტიო ინფორმაცია';
    });

    var headerColorInp = document.getElementById('warranty-table-header-color');
    if(headerColorInp) headerColorInp.addEventListener('input', function(){
      ensureTable().headerColor = headerColorInp.value;
      dirty.warrantyTemplate = true;
