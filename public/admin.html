<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technoline — ადმინ პანელი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1B2B; --ink-soft:#4A5A6C; --ink-faint:#7C8CA0;
    --paper:#FFFFFF; --paper-soft:#F6F8FB; --paper-deep:#EEF2F7;
    --line:#E1E7EF; --line-soft:#EDF1F6;
    --blue:#0E4F8E; --blue-deep:#0A3A69; --blue-deeper:#082B4E; --blue-soft:#DCEAF6; --blue-soft-2:#B8D2E8; --blue-mid:#5C86AE;
    --gold:#FCBB2D; --gold-deep:#C98A08; --gold-soft:#FFD788; --gold-ghost:#FFEAC5;
    --ok:#1E8E5A; --warn:#C98A08; --err:#C0392B;
    --font-geo:'Noto Sans Georgian','Segoe UI',sans-serif;
    --font-display:'Unbounded','Noto Sans Georgian',sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EEF4FB; --ink-soft:#AFC0D5; --ink-faint:#7E93AC;
      --paper:#0C1826; --paper-soft:#0F1F32; --paper-deep:#13273D;
      --line:#1E3B58; --line-soft:#173049;
      --blue:#5FA0DC; --blue-deep:#82B4E6; --blue-deeper:#B8D2E8; --blue-soft:#123350; --blue-soft-2:#1B4468; --blue-mid:#7FA9D2;
      --gold:#FCBB2D; --gold-deep:#FFD054; --gold-soft:#E4A028; --gold-ghost:#2E2410;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EEF4FB; --ink-soft:#AFC0D5; --ink-faint:#7E93AC;
    --paper:#0C1826; --paper-soft:#0F1F32; --paper-deep:#13273D;
    --line:#1E3B58; --line-soft:#173049;
    --blue:#5FA0DC; --blue-deep:#82B4E6; --blue-deeper:#B8D2E8; --blue-soft:#123350; --blue-soft-2:#1B4468; --blue-mid:#7FA9D2;
    --gold:#FCBB2D; --gold-deep:#FFD054; --gold-soft:#E4A028; --gold-ghost:#2E2410;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-geo);background:var(--paper-soft);color:var(--ink);-webkit-font-smoothing:antialiased}
  svg{display:block}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--gold-deep);outline-offset:2px;border-radius:4px}
  .icon{width:20px;height:20px}

  /* ---------- login screen ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 600px at 15% -10%, var(--blue-soft), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--gold-ghost), transparent 55%), var(--paper-soft);}
  .login-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:36px 32px;box-shadow:0 24px 60px -24px rgba(10,30,55,.25)}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .login-brand svg{width:34px;height:34px;color:var(--blue)}
  .login-brand .lb-text{display:flex;flex-direction:column;line-height:1.15}
  .login-brand b{font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
  .login-brand span{font-size:.72rem;color:var(--ink-faint);font-weight:600;letter-spacing:.02em}
  .login-card h1{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin:0 0 6px}
  .login-card p{font-size:.9rem;color:var(--ink-soft);margin:0 0 22px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.95rem;transition:border-color .15s}
  .field input:focus{border-color:var(--blue);background:var(--paper)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 20px;font-weight:700;font-size:.92rem;transition:transform .12s,box-shadow .12s,background .12s}
  .btn:active{transform:scale(.97)}
  .btn-gold{background:var(--gold);color:#241A00;box-shadow:0 10px 22px -10px rgba(201,138,8,.55)}
  .btn-gold:hover{background:var(--gold-deep)}
  .btn-gold:disabled{opacity:.55;cursor:default;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn-block{width:100%}
  .login-err{margin-top:12px;font-size:.85rem;color:var(--err);font-weight:600;display:none}
  .login-err.show{display:block}
  .login-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);font-size:.78rem;color:var(--ink-faint);line-height:1.6}
  .login-foot code{background:var(--paper-deep);padding:1px 6px;border-radius:5px;font-size:.78em}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:252px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"side top" "side main"}
  #app.is-active{display:grid}
  #topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--paper);border-bottom:1px solid var(--line);gap:16px}
  .tb-title{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
  .tb-sub{font-size:.78rem;color:var(--ink-faint);margin-top:1px}
  .tb-right{display:flex;align-items:center;gap:10px}
  .conn-pill{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink-soft);background:var(--paper-soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
  .conn-pill.ok .conn-dot{background:var(--ok)}
  .conn-pill.err .conn-dot{background:var(--err)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s,color .15s}
  .icon-btn:hover{border-color:var(--blue);color:var(--blue)}
  .icon-btn svg{width:18px;height:18px}

  #sidebar{grid-area:side;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .side-brand{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
  .side-brand svg{width:28px;height:28px;color:var(--blue);flex:none}
  .side-brand b{font-family:var(--font-display);font-weight:800;font-size:.98rem;display:block}
  .side-brand span{font-size:.68rem;color:var(--ink-faint);font-weight:700;letter-spacing:.03em}
  .side-scroll{flex:1;overflow-y:auto;padding:14px 12px 20px}
  .side-group{margin-bottom:4px}
  .side-group-label{font-size:.68rem;font-weight:800;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;padding:14px 10px 6px}
  .side-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-size:.87rem;font-weight:600;margin-bottom:2px;transition:background .12s,color .12s}
  .side-btn:hover{background:var(--paper-soft);color:var(--ink)}
  .side-btn.is-active{background:var(--blue-soft);color:var(--blue-deep);font-weight:800}
  :root[data-theme="dark"] .side-btn.is-active{color:var(--blue)}
  @media (prefers-color-scheme: dark){ .side-btn.is-active{color:var(--blue)} }
  .side-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
  .side-foot{padding:14px 20px;border-top:1px solid var(--line-soft)}
  .side-foot .btn{width:100%}

  #main{grid-area:main;overflow-y:auto;padding:28px 34px 60px}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .panel-head h2{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:0 0 4px}
  .panel-head p{margin:0;font-size:.87rem;color:var(--ink-soft);max-width:62ch;line-height:1.55}
  .status-chip{font-size:.78rem;font-weight:700;padding:6px 13px;border-radius:999px;white-space:nowrap}
  .status-chip.saved{background:var(--blue-soft);color:var(--blue-deep)}
  .status-chip.dirty{background:var(--gold-ghost);color:var(--gold-deep)}
  .status-chip.saving{background:var(--paper-deep);color:var(--ink-faint)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
  .field-block{margin-bottom:18px}
  .field-block:last-child{margin-bottom:0}
  .field-block label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
  .field-block label .ck-key{font-weight:600;font-family:monospace;font-size:.72rem;color:var(--ink-faint);background:var(--paper-soft);padding:1px 7px;border-radius:6px}
  .field-block textarea{width:100%;min-height:64px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.88rem;line-height:1.55;resize:vertical;transition:border-color .15s}
  .field-block textarea:focus{border-color:var(--blue);background:var(--paper)}
  .field-block input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.9rem;transition:border-color .15s}
  .field-block input[type=text]:focus{border-color:var(--blue);background:var(--paper)}
  .seg-label{margin:26px 0 10px;font-weight:800;font-size:.86rem;color:var(--blue)}
  .seg-label:first-child{margin-top:0}

  .color-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .color-row:last-child{border-bottom:none}
  .color-row input[type=color]{width:46px;height:46px;padding:0;border:1.5px solid var(--line);border-radius:11px;background:none;cursor:pointer}
  .color-row .cr-label{flex:1;font-size:.9rem;font-weight:700}
  .color-row .cr-hex{font-family:monospace;font-size:.82rem;color:var(--ink-faint);background:var(--paper-soft);padding:3px 9px;border-radius:7px}

  table.admin-table{width:100%;border-collapse:collapse}
  table.admin-table th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:800;padding:0 10px 10px;border-bottom:1.5px solid var(--line)}
  table.admin-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
  table.admin-table tr:last-child td{border-bottom:none}
  table.admin-table input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper-soft);color:var(--ink);font-size:.86rem}
  table.admin-table input:focus{border-color:var(--blue);background:var(--paper)}
  .part-photo-cell{display:flex;align-items:center;gap:10px}
  .part-thumb{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper-soft);object-fit:cover;flex:none}
  .part-thumb-empty{width:52px;height:52px;border-radius:10px;border:1.5px dashed var(--line);background:var(--paper-soft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:1.3rem}
  .part-photo-actions{display:flex;flex-direction:column;gap:4px}
  .part-photo-actions label{font-size:.76rem;font-weight:700;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;text-align:left}
  .part-photo-actions button{font-size:.76rem;font-weight:700;color:var(--ink-faint);cursor:pointer;background:none;border:none;padding:0;text-align:left}
  .part-photo-actions input[type=file]{display:none}
  .field-hint{font-size:.8rem;color:var(--ink-faint);line-height:1.5}

  .bg-type-row{display:flex;gap:10px;margin-bottom:16px}
  .bg-type-btn{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink-soft);font-size:.86rem;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .bg-type-btn.is-active{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-soft)}
  .drag-preview{-webkit-user-select:none;user-select:none;touch-action:none}
  .drag-chip{background:rgba(8,18,30,.62);backdrop-filter:blur(2px);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;transition:opacity .15s}
  .drag-chip.is-dragging{cursor:grabbing;border-color:var(--gold)}
  .drag-chip.is-hidden{opacity:.42}
  .drag-chip-label{color:#fff;font-size:.78rem;font-weight:700;white-space:nowrap}
  .drag-eye{background:none;border:none;padding:0;cursor:pointer;font-size:.9rem;line-height:1;opacity:.9}
  .drag-eye:hover{opacity:1}

  .branch-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .branch-card:last-child{margin-bottom:0}
  .branch-card h3{margin:0 0 12px;font-size:.95rem;font-weight:800;color:var(--blue)}
  .branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:760px){.branch-grid{grid-template-columns:1fr}}

  .save-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 0 4px;margin-top:6px;background:linear-gradient(180deg, transparent, var(--paper-soft) 30%)}

  .booking-row{display:grid;grid-template-columns:110px 1fr 140px 90px;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-soft);font-size:.86rem}
  .booking-row:last-child{border-bottom:none}
  .booking-row .bcode{font-family:monospace;font-weight:800;color:var(--blue)}
  .booking-row .bname{font-weight:700}
  .booking-row .bmeta{color:var(--ink-faint);font-size:.8rem;margin-top:2px}
  .booking-row .bstatus{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep);text-align:center;white-space:nowrap}
  @media (max-width:760px){.booking-row{grid-template-columns:1fr;gap:4px}}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint)}
  .empty-state svg{width:40px;height:40px;margin:0 auto 14px;opacity:.5}
  .empty-state p{margin:0;font-size:.9rem}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:12px;font-size:.86rem;font-weight:600;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:999}
  :root[data-theme="dark"] .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  @media (prefers-color-scheme: dark){ .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)} }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:880px){
    #app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
    #sidebar{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
    #sidebar.is-open{transform:translateX(0)}
    #sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(8,18,30,.4);z-index:39}
    #sidebar-scrim.show{display:block}
    #main{padding:20px}
  }
  @media (min-width:881px){ #sidebar-scrim{display:none} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-logo" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
      <path d="M32 6c14.36 0 26 11.64 26 26S46.36 58 32 58"/>
      <path d="M14 50.2C9.02 45.28 6 38.48 6 31c0-13.8 11.2-25 25-25"/>
      <circle cx="32" cy="32" r="17.5"/>
    </g>
    <path d="M32 20.5v8.3M25 26a9 9 0 1 0 14 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.1 5.9l-1.9 1.9M7.8 16.3l-1.9 1.9M18.1 18.1l-1.9-1.9M7.8 7.7 5.9 5.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H16a5 5 0 0 0 5-5c0-3.9-4-6.8-9-6.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="10.5" r="1.3" fill="currentColor"/><circle cx="10.5" cy="7" r="1.3" fill="currentColor"/><circle cx="15.2" cy="7.6" r="1.3" fill="currentColor"/></symbol>
  <symbol id="ic-box" viewBox="0 0 24 24"><path d="M3 8l9-4.5L21 8v8l-9 4.5L3 16V8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 8l9 4.5L21 8M12 12.5V21" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-inbox" viewBox="0 0 24 24"><path d="M3 12h5l1.6 3h4.8L16 12h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 12v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6L18 5a2 2 0 0 0-1.8-1H7.8A2 2 0 0 0 6 5L3 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <svg><use href="#ic-logo"/></svg>
      <div class="lb-text"><b>Technoline</b><span>ADMIN PANEL</span></div>
    </div>
    <h1>ავტორიზაცია</h1>
    <p>შედით საიტის სამართავად — კონტენტი, ფერები, ნაწილების კატალოგი, ფილიალები და ვიზიტების ჯავშნები.</p>
    <div class="field">
      <label for="login-password">პაროლი</label>
      <input type="password" id="login-password" placeholder="შეიყვანეთ პაროლი" autocomplete="current-password">
    </div>
    <button class="btn btn-gold btn-block" id="login-btn">შესვლა</button>

  function parseCk(key){
    var parts = key.split('.');
    var page = parts[0];
    if(parts.length >= 3) return {page:page, sub:parts[1], field:parts.slice(2).join('.')};
    var last = parts[1];
    var m = last.match(/^([a-zA-Z]+)(\d)(Num|Label)$/);
    if(m) return {page:page, sub:m[1]+m[2], field:m[3]};
    return {page:page, sub:null, field:last};
  }
  function humanizeSegment(seg){
    var m = seg.match(/^([a-zA-Z]+?)(\d+)$/);
    if(m) return (SEGMENT_LABELS[m[1]] || m[1]) + ' ' + m[2];
    return SEGMENT_LABELS[seg] || seg;
  }
  function labelForCk(key){ return CK_FIELD_LABELS[parseCk(key).field] || parseCk(key).field; }
  function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function doLogin(){
    var pwd = document.getElementById('login-password').value;
    var errEl = document.getElementById('login-err');
    var btn = document.getElementById('login-btn');
    errEl.classList.remove('show');
    if(!pwd){ errEl.textContent = 'შეიყვანეთ პაროლი'; errEl.classList.add('show'); return; }
    btn.disabled = true; btn.textContent = 'შემოწმება…';
    fetch(API_BASE + '/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pwd})
    }).then(function(res){
      if(!res.ok) throw new Error('bad_login');
      return res.json();
    }).then(function(data){
      authToken = data.token;
      try{ sessionStorage.setItem('tl_admin_token', authToken); }catch(e){}
      enterApp();
    }).catch(function(){
      errEl.textContent = 'პაროლი არასწორია ან სერვერთან კავშირი ვერ დამყარდა (' + API_BASE + ')';

  function renderSvcPhotoField(imgKey){

  function renderContentPanel(main, tab){
    var keys = CONTENT_ORDER.filter(function(k){ return parseCk(k).page === tab.page; });
    var html = panelHeadHtml(tab, 'შეცვალეთ ტექსტი და დააჭირეთ „ცვლილებების შენახვას“. მარტივი HTML ტეგები (em, strong, br) დაშვებულია და შენარჩუნდება საიტზე.');
    html += '<div class="card">';
    var lastSub;
    keys.forEach(function(k){
      var p = parseCk(k);
      if(p.sub !== lastSub){
        if(p.sub) html += '<div class="seg-label">' + humanizeSegment(p.sub) + '</div>';
        lastSub = p.sub;
      }
      var val = Object.prototype.hasOwnProperty.call(state.content,k) ? state.content[k] : CONTENT_DEFAULTS[k];
      html += '<div class="field-block">'
        + '<label>' + labelForCk(k) + '<span class="ck-key">' + k + '</span></label>'
        + '<textarea data-ck-edit="'+escAttr(k)+'">' + escHtml(val) + '</textarea>'
        + '</div>';
      if(SVC_TILE_IMAGE_MAP[k]) html += renderSvcPhotoField(SVC_TILE_IMAGE_MAP[k]);
    });
    html += '</div>';
    html += saveBarHtml();
    main.innerHTML = html;

    main.querySelectorAll('[data-ck-edit]').forEach(function(ta){
      ta.addEventListener('input', function(){
        state.content[ta.getAttribute('data-ck-edit')] = ta.value;
        setDirty(tab, true);
        updateStatusChip(tab);
      });
    });

    function refreshSvcPhotoCell(imgKey){
      var cell = main.querySelector('[data-svc-photo-cell="'+imgKey+'"]');
      if(!cell) return;
      var val = state.content[imgKey];
      cell.innerHTML = (val ? '<img class="part-thumb" src="'+val+'" alt="">' : '<div class="part-thumb-empty">—</div>')
        + '<div class="part-photo-actions">'
          + '<label>ატვირთვა<input type="file" accept="image/*" data-svc-photo></label>'
          + (val ? '<button type="button" data-svc-photo-clear>წაშლა</button>' : '')
        + '</div>';
      wireSvcPhotoCell(imgKey);
    }
    function wireSvcPhotoCell(imgKey){
      var cell = main.querySelector('[data-svc-photo-cell="'+imgKey+'"]');
      if(!cell) return;
      var fileInp = cell.querySelector('[data-svc-photo]');
      if(fileInp){
        fileInp.addEventListener('change', function(){
          var file = fileInp.files && fileInp.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(){
            var img = new Image();
            img.onload = function(){
              var scale = Math.min(1, SVC_PHOTO_MAX_W / img.width);
              var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              state.content[imgKey] = canvas.toDataURL('image/jpeg', SVC_PHOTO_QUALITY);
              setDirty(tab, true);
              updateStatusChip(tab);
              refreshSvcPhotoCell(imgKey);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      var clearBtn = cell.querySelector('[data-svc-photo-clear]');
      if(clearBtn){
        clearBtn.addEventListener('click', function(){
          delete state.content[imgKey];
          setDirty(tab, true);
          updateStatusChip(tab);
          refreshSvcPhotoCell(imgKey);
        });
      }
    }
    Object.keys(SVC_TILE_IMAGE_MAP).forEach(function(descKey){ wireSvcPhotoCell(SVC_TILE_IMAGE_MAP[descKey]); });

    wireSaveBar(tab, function(){ return {path:'content-site', body: state.content}; });
  }

        + '<div class="part-photo-actions">'
          + '<label>ატვირთვა<input type="file" accept="image/*" data-herobg-photo-upload></label>'
          + (photoVal ? '<button type="button" data-herobg-photo-clear>წაშლა</button>' : '')
        + '</div>'

      + '</div>';

      + '<label>ბანერის სიმაღლე<span class="ck-key" data-herobg-height-readout>'+(h ? h+'vh' : 'ავტომატური')+'</span></label>'
      + '<input type="range" data-herobg-height min="0" max="95" step="5" value="'+h+'" style="width:100%">'
      + '<p class="field-hint" style="margin-top:6px">0 = ავტომატური სიმაღლე (ნაგულისხმევი). მარჯვნივ გადაწევით ბანერი გაიწელება ეკრანის სიმაღლის მიხედვით.</p>'
      + '</div>';

    return html;

  function renderDragPreview(groupKey){
    var group = LAYOUT_GROUPS[groupKey];
    if(!group) return '';
    var html = '<div class="seg-label">მდებარეობა და ხილვადობა ბანერზე</div>';
    html += '<div class="drag-preview" data-drag-preview style="position:relative;height:170px;border-radius:10px;overflow:hidden;background:'+group.bg+';margin:10px 0 14px;border:1px solid var(--line)">';
    group.fields.forEach(function(f){
      var x = Number(state.theme[f.posX]) || 0;
      var y = Number(state.theme[f.posY]) || 0;
      var hidden = !!state.theme[f.hidden];
      html += '<div class="drag-chip'+(hidden?' is-hidden':'')+'" data-drag-chip data-pos-x="'+f.posX+'" data-pos-y="'+f.posY+'" data-base-left="'+f.left+'" data-base-top="'+f.top+'" '
        + 'style="left:'+(f.left+x)+'px;top:'+(f.top+y)+'px">'
        + '<span class="drag-chip-label">'+f.label+'</span>'
        + '<button type="button" class="drag-eye" data-drag-hidden-key="'+f.hidden+'" title="ჩვენება/დამალვა">'+(hidden?'🚫':'👁')+'</button>'
        + '</div>';
    });
    html += '</div>';
    html += '<p class="field-hint">გადაათრიეთ ტექსტის ბლოკი — ცვლილება მაშინვე აისახება საიტზეც. თვალის ხატულა მალავს/აჩვენებს ამ ტექსტს.</p>';
    return html;
  }

  function renderTypographyPanel(main, tab){
    var html = panelHeadHtml(tab, 'მართეთ საიტის ბანერები — მთავარი ბანერი, მთავარი გვერდის სერვის-ბარათები და ქვედა CTA ბლოკები: ტექსტის ფერი, ზომა, მდებარეობა და ხილვადობა, ასევე Hero ბანერის ფონი და სიმაღლე. თუ არაფერს შეცვლით, საიტის ნაგულისხმევი დიზაინი დარჩება.');
    html += renderHeroBgSection();
    TYPOGRAPHY_GROUPS.forEach(function(g){
      html += '<div class="card"><div class="seg-label" style="margin-top:0">'+g.label+'</div>';
      g.fields.forEach(function(f){
        if(f.type === 'color'){
          var v = state.theme[f.key] || f.def;
          html += '<div class="color-row">'
            + '<input type="color" data-typo-color="'+f.key+'" value="'+v+'">'
            + '<span class="cr-label">'+f.label+'</span>'
            + '<span class="cr-hex">'+v.toUpperCase()+'</span>'
            + '</div>';
        } else {
          var sv = (state.theme[f.key] != null && state.theme[f.key] !== '') ? Number(state.theme[f.key]) : f.def;
          html += '<div class="field-block">'
            + '<label>'+f.label+'<span class="ck-key" data-typo-readout="'+f.key+'">'+sv.toFixed(2)+'rem</span></label>'
            + '<input type="range" data-typo-size="'+f.key+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+sv+'" style="width:100%">'
            + '</div>';
        }
      });
      html += renderDragPreview(g.key);
      html += '</div>';
    });
    html += saveBarHtml();
    main.innerHTML = html;

    main.querySelectorAll('[data-typo-color]').forEach(function(inp){
      inp.addEventListener('input', function(){
        state.theme[inp.getAttribute('data-typo-color')] = inp.value;
        setDirty(tab, true);
        inp.parentElement.querySelector('.cr-hex').textContent = inp.value.toUpperCase();
        updateStatusChip(tab);
      });
    });
    main.querySelectorAll('[data-typo-size]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var key = inp.getAttribute('data-typo-size');
        state.theme[key] = inp.value;
        setDirty(tab, true);
        var ro = main.querySelector('[data-typo-readout="'+key+'"]');
        if(ro) ro.textContent = Number(inp.value).toFixed(2)+'rem';
        updateStatusChip(tab);
      });
    });

    /* ---- hero background: type toggle, photo upload, height ---- */
    main.querySelectorAll('[data-herobg-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.theme.heroBgType = btn.getAttribute('data-herobg-type');
        setDirty(tab, true);
        updateStatusChip(tab);
        main.querySelectorAll('[data-herobg-type]').forEach(function(b){ b.classList.toggle('is-active', b===btn); });
      });
    });
    function refreshHeroPhotoCell(){
      var cell = main.querySelector('[data-herobg-photo-cell]');
      if(!cell) return;
      var val = state.theme.heroBgPhoto || '';
      cell.innerHTML = (val ? '<img class="part-thumb" src="'+val+'" alt="">' : '<div class="part-thumb-empty">—</div>')
        + '<div class="part-photo-actions">'
          + '<label>ატვირთვა<input type="file" accept="image/*" data-herobg-photo-upload></label>'
          + (val ? '<button type="button" data-herobg-photo-clear>წაშლა</button>' : '')
        + '</div>';
      wireHeroPhotoCell();
    }
    function wireHeroPhotoCell(){
      var cell = main.querySelector('[data-herobg-photo-cell]');
      if(!cell) return;
      var fileInp = cell.querySelector('[data-herobg-photo-upload]');
      if(fileInp){
        fileInp.addEventListener('change', function(){
          var file = fileInp.files && fileInp.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(){
            var img = new Image();
            img.onload = function(){
              var scale = Math.min(1, HERO_BG_PHOTO_MAX_W / img.width);
              var w = Math.round(img.width * scale), h2 = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h2;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h2);
              state.theme.heroBgPhoto = canvas.toDataURL('image/jpeg', HERO_BG_PHOTO_QUALITY);
              setDirty(tab, true);
              updateStatusChip(tab);
              refreshHeroPhotoCell();
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      var clearBtn = cell.querySelector('[data-herobg-photo-clear]');
      if(clearBtn){
        clearBtn.addEventListener('click', function(){
          delete state.theme.heroBgPhoto;
          setDirty(tab, true);
          updateStatusChip(tab);
          refreshHeroPhotoCell();
        });
      }
    }
    wireHeroPhotoCell();

    var heightInp = main.querySelector('[data-herobg-height]');
    if(heightInp){
      heightInp.addEventListener('input', function(){
        var v = Number(heightInp.value) || 0;
        state.theme.heroMinHeight = v;
        setDirty(tab, true);
        var ro = main.querySelector('[data-herobg-height-readout]');
        if(ro) ro.textContent = v ? v+'vh' : 'ავტომატური';
        updateStatusChip(tab);
      });
    }

    /* ---- drag position + visibility ---- */
    function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
    main.querySelectorAll('[data-drag-chip]').forEach(function(chip){
      var xKey = chip.getAttribute('data-pos-x'), yKey = chip.getAttribute('data-pos-y');
      var baseLeft = Number(chip.getAttribute('data-base-left'));
      var baseTop = Number(chip.getAttribute('data-base-top'));
      var dragging = false, startPX = 0, startPY = 0, startX = 0, startY = 0;
      chip.addEventListener('pointerdown', function(e){
        if(e.target.closest('.drag-eye')) return;
        dragging = true;
        try{ chip.setPointerCapture(e.pointerId); }catch(err){}
        startPX = e.clientX; startPY = e.clientY;
        startX = Number(state.theme[xKey]) || 0;
        startY = Number(state.theme[yKey]) || 0;
        chip.classList.add('is-dragging');
      });
      chip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var dx = clamp(startX + (e.clientX - startPX), -DRAG_CLAMP_X, DRAG_CLAMP_X);
        var dy = clamp(startY + (e.clientY - startPY), -DRAG_CLAMP_Y, DRAG_CLAMP_Y);
        state.theme[xKey] = dx; state.theme[yKey] = dy;
        chip.style.left = (baseLeft + dx) + 'px';
        chip.style.top = (baseTop + dy) + 'px';
      });
      function endDrag(){
        if(!dragging) return;
        dragging = false;
        chip.classList.remove('is-dragging');
        setDirty(tab, true);
        updateStatusChip(tab);
      }
      chip.addEventListener('pointerup', endDrag);
      chip.addEventListener('pointercancel', endDrag);
    });
    main.querySelectorAll('[data-drag-hidden-key]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var key = btn.getAttribute('data-drag-hidden-key');
        state.theme[key] = !state.theme[key];
        setDirty(tab, true);
        updateStatusChip(tab);
        renderMain();
      });
    });

    wireSaveBar(tab, function(){ return {path:'theme-site', body: state.theme}; });
  }

  function saveBarHtml(){
    return '<div class="save-bar"><button class="btn btn-ghost" id="btn-reset">ნაგულისხმევზე დაბრუნება</button><button class="btn btn-gold" id="btn-save">ცვლილებების შენახვა</button></div>';
  }

  function wireSaveBar(tab, getPayload){
    var saveBtn = document.getElementById('btn-save');
    var resetBtn = document.getElementById('btn-reset');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var payload = getPayload();
      saveBtn.disabled = true; saveBtn.textContent = 'ინახება…';
      apiPut('/api/site/' + payload.path, payload.body).then(function(){
        setDirty(tab, false);
        updateStatusChip(tab);
        toast('ცვლილებები შენახულია');
      }).catch(function(err){
        var msg = (err && err.status === 401) ? 'ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ' : 'შენახვა ვერ მოხერხდა — სცადეთ თავიდან';
        toast(msg);
        if(err && err.status === 401) document.getElementById('logout-btn').click();
      }).finally(function(){
        saveBtn.disabled = false; saveBtn.textContent = 'ცვლილებების შენახვა';
      });
    });
    if(resetBtn) resetBtn.addEventListener('click', function(){
      if(!confirm('დარწმუნებული ხართ, რომ გსურთ ამ ჩანართის ნაგულისხმევ მდგომარეობაში დაბრუნება?')) return;
      if(tab.kind === 'content'){
        CONTENT_ORDER.filter(function(k){ return parseCk(k).page === tab.page; }).forEach(function(k){ delete state.content[k]; });
      } else if(tab.kind === 'colors'){ THEME_TOKENS.forEach(function(t){ delete state.theme[t.key]; }); }
      else if(tab.kind === 'typography'){
        TYPOGRAPHY_GROUPS.forEach(function(g){ g.fields.forEach(function(f){ delete state.theme[f.key]; }); });
        Object.keys(LAYOUT_GROUPS).forEach(function(gk){
          LAYOUT_GROUPS[gk].fields.forEach(function(f){ delete state.theme[f.posX]; delete state.theme[f.posY]; delete state.theme[f.hidden]; });
        });
        delete state.theme.heroBgType; delete state.theme.heroBgPhoto; delete state.theme.heroMinHeight;
      }
      else if(tab.kind === 'parts'){ state.parts = {}; }
      else if(tab.kind === 'branches'){ state.branches = {}; }
      setDirty(tab, true);
      renderMain();
    });
  }

    document.getElementById('sidebar-scrim').classList.remove('show');
  });
  function updateMobileNavVisibility(){
    document.getElementById('mobile-nav-btn').style.display = window.innerWidth <= 880 ? 'flex' : 'none';
  }
  window.addEventListener('resize', updateMobileNavVisibility);
  updateMobileNavVisibility();

  /* Auto-enter if a token from an earlier session in this tab is still around. */
  if(authToken){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('is-active');
    buildTabs();
    checkConnection();
    loadAll().then(function(){ selectTab(TABS[0].id); }).catch(function(){});
  }
})();
</script>
</body>
</html>
