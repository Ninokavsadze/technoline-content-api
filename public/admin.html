        tableChip.style.borderColor = headerColorInp.value;
        var headerDiv = tableChip.querySelector('div:first-child');
        if(headerDiv) headerDiv.style.background = headerColorInp.value;
      }
    });

    var headerTextColorInp = document.getElementById('warranty-table-header-text-color');
    if(headerTextColorInp) headerTextColorInp.addEventListener('input', function(){
      ensureTable().headerTextColor = headerTextColorInp.value;
      dirty.warrantyTemplate = true;
      if(tableChip){
        var headerDiv = tableChip.querySelector('div:first-child');
        if(headerDiv) headerDiv.style.color = headerTextColorInp.value;
      }
    });

    var widthInp = document.getElementById('warranty-table-width');
    if(widthInp) widthInp.addEventListener('input', function(){
      ensureTable().widthPct = Number(widthInp.value);
      dirty.warrantyTemplate = true;
      var ro = host.querySelector('[data-warranty-table-readout="widthPct"]');
      if(ro) ro.textContent = widthInp.value + '%';
      if(tableChip) tableChip.style.width = widthInp.value + '%';
    });

    var fontSizeInp = document.getElementById('warranty-table-font-size');
    if(fontSizeInp) fontSizeInp.addEventListener('input', function(){
      ensureTable().fontSize = Number(fontSizeInp.value);
      dirty.warrantyTemplate = true;
      var ro = host.querySelector('[data-warranty-table-readout="fontSize"]');
      if(ro) ro.textContent = fontSizeInp.value + 'pt';
      if(tableChip && warrantyPagePreview) tableChip.style.height = warrantyTableHeightPct(state.warrantyTemplate.table, warrantyPagePreview.height) + '%';
    });

    var testBtn = document.getElementById('warranty-pdf-test');
    if(testBtn) testBtn.addEventListener('click', function(){
      testBtn.disabled = true; testBtn.textContent = 'ინახება და იტვირთება…';
      apiPut('/api/site/warranty-template', state.warrantyTemplate).then(function(){
        dirty.warrantyTemplate = false;
        return apiPostPdf('/api/warranty-template/preview', {
          customerName:'ტესტ მომხმარებელი', serial:'TL-TEST-0001', model:'iPhone 13 Pro',
          purchase:'2026-01-01', warrantyEnd:'2026-07-01'
        });
      }).then(function(blob){
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }).catch(function(err){
        toast(err && err.status === 401 ? 'ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ' : 'ტესტის გაშვება ვერ მოხერხდა');
        if(err && err.status === 401) document.getElementById('logout-btn').click();
      }).finally(function(){
        testBtn.disabled = false; testBtn.textContent = 'სატესტო ბარათის გახსნა';
      });
    });

    var saveBtn = document.getElementById('btn-warranty-save');
    var resetBtn = document.getElementById('btn-warranty-reset');
    saveBtn.addEventListener('click', function(){
      saveBtn.disabled = true; saveBtn.textContent = 'ინახება…';
      apiPut('/api/site/warranty-template', state.warrantyTemplate).then(function(){
        dirty.warrantyTemplate = false;
        toast('ცვლილებები შენახულია');
      }).catch(function(err){
        toast(err && err.status === 401 ? 'ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ' : 'შენახვა ვერ მოხერხდა');
        if(err && err.status === 401) document.getElementById('logout-btn').click();
      }).finally(function(){
        saveBtn.disabled = false; saveBtn.textContent = 'ცვლილებების შენახვა';
      });
    });
    resetBtn.addEventListener('click', function(){
      if(!confirm('ბოლო შენახული მდგომარეობა ხელახლა ჩამოიტვირთოს? შეუნახავი ცვლილებები დაიკარგება.')) return;
      apiGet('/api/site/warranty-template').then(function(d){
        state.warrantyTemplate = d || {};
        warrantyPagePreview = null;
        warrantyViewedPage = null;
        dirty.warrantyTemplate = false;
        renderWarrantyTemplateSubpanel(tab);
      });
    });
  }

      var op = document.createElement('option'); op.value = id; op.textContent = branchMap[id]; bkBranchSel.appendChild(op);
    });

    var allBookings = [];
    var sortKey = 'created', sortDir = -1;
    function pad2(n){ return String(n).padStart(2,'0'); }
    function localParts(iso){
      var d = new Date(iso);
      if(isNaN(d.getTime())) return {d:'', t:''};
      return {d: d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()), t: pad2(d.getHours()) + ':' + pad2(d.getMinutes())};
    }
    function fmtCreated(iso){
      var p = localParts(iso); if(!p.d) return '';
      var a = p.d.split('-'); return a[2] + '.' + a[1] + '.' + a[0] + ' ' + p.t;
    }
    function fmtVisitDate(d){ var a = String(d||'').split('-'); return a.length === 3 ? a[2] + '.' + a[1] + '.' + a[0] : (d || ''); }
    var COLS = [
      {key:'code',    label:'კოდი',            get:function(b){ return b.confirmationCode || ''; }},
      {key:'name',    label:'სახელი',          get:function(b){ return b.name || ''; }},
      {key:'phone',   label:'ტელეფონი',        get:function(b){ return b.phone || ''; }},
      {key:'branch',  label:'ფილიალი',         get:function(b){ return branchMap[b.branchId] || b.branchId || ''; }},
      {key:'device',  label:'მოწყობილობა',     get:function(b){ return b.deviceType || ''; }},
      {key:'issue',   label:'პრობლემა',        get:function(b){ return b.issue || b.serviceType || ''; }},
      {key:'vdate',   label:'ვიზიტის თარიღი',  get:function(b){ return b.date || ''; }},
      {key:'vtime',   label:'საათი',           get:function(b){ return b.timeSlot || ''; }},
      {key:'status',  label:'სტატუსი',         get:function(b){ return b.status || 'received'; }},
      {key:'qlogic',  label:'Q-Logic',         get:function(b){ return b.qlogicId ? '1' : '0'; }},
      {key:'created', label:'დაჯავშნის დრო',   get:function(b){ return b.createdAt || ''; }},
      {key:'notes',   label:'შენიშვნა',        get:function(b){ return b.notes || ''; }}
    ];
    function colByKey(k){ return COLS.find(function(c){ return c.key === k; }); }

    function matches(b, f){
      if(f.q){
        var hay = [b.confirmationCode, b.name, b.phone, b.serviceType, b.issue, b.deviceType, b.status, b.notes, branchMap[b.branchId]]
          .map(function(v){ return String(v||'').toLowerCase(); }).join(' ');
        if(hay.indexOf(f.q) === -1) return false;
      }
      if(f.branch && b.branchId !== f.branch) return false;
      var d, t;
      if(f.mode === 'created'){ var lp = localParts(b.createdAt); d = lp.d; t = lp.t; }
      else { d = b.date || ''; t = b.timeSlot || ''; }
      if(f.fromD){ if(!d || (d + ' ' + (t||'00:00')) < (f.fromD + ' ' + (f.fromT || '00:00'))) return false; }
      else if(f.fromT){ if(!t || t < f.fromT) return false; }
      if(f.toD){ if(!d || (d + ' ' + (t||'00:00')) > (f.toD + ' ' + (f.toT || '23:59'))) return false; }
      else if(f.toT){ if(!t || t > f.toT) return false; }
      return true;
    }
    function currentFilter(){
      return {
        q: document.getElementById('bk-search').value.trim().toLowerCase(),
        mode: document.getElementById('bk-mode').value,
        fromD: document.getElementById('bk-from-d').value, fromT: document.getElementById('bk-from-t').value,
        toD: document.getElementById('bk-to-d').value, toT: document.getElementById('bk-to-t').value,
        branch: bkBranchSel.value
      };
    }
    function cellHtml(c, b){
      var v = c.get(b);
      if(c.key === 'code') return '<td class="xl-code">' + escHtml(v) + '</td>';
      if(c.key === 'name') return '<td class="xl-name">' + escHtml(v) + '</td>';
      if(c.key === 'vdate') return '<td>' + escHtml(fmtVisitDate(v)) + '</td>';
      if(c.key === 'created') return '<td>' + escHtml(fmtCreated(v)) + '</td>';
      if(c.key === 'status') return '<td><span class="xl-pill">' + escHtml(v) + '</span></td>';
      if(c.key === 'qlogic'){
        // Smart Q-Logic sync happens after the booking is saved (see server.js) —
        // a booking with no qlogicId means that sync never went through, so no
        // confirmation SMS was sent even though the booking itself was received.
        return b.qlogicId
          ? '<td class="xl-ok">✓ ' + escHtml(b.qlogicVerifyCode || 'დასინქრონდა') + '</td>'
          : '<td class="xl-bad" title="' + escAttr(b.qlogicError || '') + '">✗ ვერ დასინქრონდა' + (b.qlogicError ? ' (' + escHtml(String(b.qlogicError).slice(0,40)) + ')' : '') + '</td>';
      }
      return '<td>' + escHtml(v) + '</td>';
    }
    function render(){
      var card = document.getElementById('bookings-card');
      if(!card) return;
      var f = currentFilter();
      var list = allBookings.filter(function(b){ return matches(b, f); });
      var col = colByKey(sortKey);
      list.sort(function(a, b){
        var x = col.get(a), y = col.get(b);
        return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
      });
      document.getElementById('bk-count').textContent = 'ნაპოვნია ' + list.length + ' ჩანაწერი (სულ ' + allBookings.length + ')';
      if(!list.length){
        card.innerHTML = '<div class="empty-state card"><svg><use href="#ic-inbox"/></svg><p>ვერაფერი მოიძებნა.</p></div>';
        return;
      }
      var head = '<tr><th class="xl-rn">#</th>' + COLS.map(function(c){
        return '<th data-bk-sort="' + c.key + '">' + escHtml(c.label) + '<span class="xl-arrow">' + (c.key === sortKey ? (sortDir === 1 ? '▲' : '▼') : '') + '</span></th>';
      }).join('') + '</tr>';
      var body = list.map(function(b, i){
        return '<tr><td class="xl-rn">' + (i + 1) + '</td>' + COLS.map(function(c){ return cellHtml(c, b); }).join('') + '</tr>';
      }).join('');
      card.innerHTML = '<div class="xl-wrap"><table class="xl-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
      card.querySelectorAll('[data-bk-sort]').forEach(function(th){
        th.addEventListener('click', function(){
          var k = th.getAttribute('data-bk-sort');
          if(sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
          render();
        });
      });
    }

    ['bk-search','bk-from-d','bk-from-t','bk-to-d','bk-to-t'].forEach(function(id){
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });
    document.getElementById('bk-mode').addEventListener('change', render);
    bkBranchSel.addEventListener('change', render);
    function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
    main.querySelectorAll('[data-bk-quick]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-bk-quick');
        var now = new Date(), fd = '', td = '';
        if(k === 'today'){ fd = td = ymd(now); }
        else if(k === 'tomorrow'){ var t1 = new Date(now); t1.setDate(t1.getDate()+1); fd = td = ymd(t1); }
        else if(k === 'week'){ var t2 = new Date(now); t2.setDate(t2.getDate()+6); fd = ymd(now); td = ymd(t2); }
        if(k === 'clear'){
          document.getElementById('bk-search').value = ''; document.getElementById('bk-mode').value = 'visit'; bkBranchSel.value = '';
          ['bk-from-t','bk-to-t'].forEach(function(id){ document.getElementById(id).value = ''; });
        } else if(document.getElementById('bk-mode').value !== 'visit' && k !== 'clear'){
          // quick buttons are about the visit date
          document.getElementById('bk-mode').value = 'visit';
        }
        document.getElementById('bk-from-d').value = fd; document.getElementById('bk-to-d').value = td;
        render();
      });
    });

    apiGet('/api/bookings').then(function(list){
      allBookings = list || [];
      var card = document.getElementById('bookings-card');
      if(!card) return;
      if(!allBookings.length){
        card.innerHTML = '<div class="empty-state card"><svg><use href="#ic-inbox"/></svg><p>ჯერ არცერთი ჯავშანი არ დაფიქსირებულა.</p></div>';
        document.getElementById('bk-count').textContent = '';
        return;
      }
      render();
    }).catch(function(){
      var card = document.getElementById('bookings-card');
      if(card) card.innerHTML = '<div class="empty-state card"><svg><use href="#ic-inbox"/></svg><p>ჯავშნების ჩატვირთვა ვერ მოხერხდა — შეამოწმეთ სერვერთან კავშირი.</p></div>';
    });
  }

  /* ---------- live chat (WebSocket) ---------- */
  function chatUnreadCount(){
    return Object.keys(chatState.chats).filter(function(id){ return chatState.chats[id].unread; }).length;
  }
  function chatWsUrl(){
    return API_BASE.replace(/^https/, 'wss').replace(/^http:/, 'ws:') + '/ws/admin-chat?token=' + encodeURIComponent(authToken || '');
  }
  function connectChatWs(){
    if(!authToken || chatState.ws) return;
    var ws;
    try{ ws = new WebSocket(chatWsUrl()); }catch(e){ return; }
    chatState.ws = ws;
    ws.onopen = function(){ chatState.wsReady = true; };
    ws.onclose = function(){
      chatState.wsReady = false;
      if(chatState.ws === ws) chatState.ws = null;
      clearTimeout(chatState.reconnectTimer);
      chatState.reconnectTimer = setTimeout(function(){ if(authToken) connectChatWs(); }, 4000);
    };
    ws.onerror = function(){ try{ ws.close(); }catch(e){} };
    ws.onmessage = function(evt){
      var msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      handleChatWsMessage(msg);
    };
  }
  function handleChatWsMessage(msg){
    if(msg.type === 'chat_new'){
      if(!chatState.chats[msg.chat.id]){
        chatState.chats[msg.chat.id] = msg.chat;
        chatState.chats[msg.chat.id].unread = true;
      }
    } else if(msg.type === 'message'){
      var c = chatState.chats[msg.chatId];
      if(!c) c = chatState.chats[msg.chatId] = { id: msg.chatId, messages: [] };
      c.messages = c.messages || [];
      c.messages.push(msg.message);
      if(msg.chatSummary){
        c.name = msg.chatSummary.name; c.phone = msg.chatSummary.phone; c.status = msg.chatSummary.status; c.lastAt = msg.chatSummary.lastAt;
        // full assignment, not just "set true" — a customer can send the chat
        // back to the AI (return_to_ai), which must be able to flip these back off
        c.aiPaused = !!msg.chatSummary.aiPaused;
        c.operatorJoined = !!msg.chatSummary.operatorJoined;
        if(msg.chatSummary.assignedOperator) c.assignedOperator = msg.chatSummary.assignedOperator;
      }
      if(msg.message.from === 'customer' && chatState.selectedId !== msg.chatId) c.unread = true;
    } else if(msg.type === 'chat_status'){
      var cs = chatState.chats[msg.chatId];
      if(cs) cs.status = msg.status;
    } else {
      return;
    }
    renderNav();
    renderChatListDom();
    if(chatState.selectedId && chatState.chats[chatState.selectedId] &&
       (msg.chatId === chatState.selectedId || msg.chat && msg.chat.id === chatState.selectedId)){
      renderChatThreadDom();
    }
  }
  function chatSortedList(){
    return Object.keys(chatState.chats).map(function(id){ return chatState.chats[id]; })
      .sort(function(a, b){ return (b.lastAt || 0) - (a.lastAt || 0); });
  }
  function chatAiTagHtml(c){
    if(c.aiPaused && !c.operatorJoined) return '<span style="font-size:.66rem;font-weight:700;color:#fff;background:var(--bad,#B3261E);padding:1px 6px;border-radius:999px;white-space:nowrap">⏳ ოპერატორის მოლოდინში</span>';
    if(c.operatorJoined) return '<span style="font-size:.66rem;font-weight:700;color:var(--blue-deep);background:var(--blue-soft,#E7F0FB);padding:1px 6px;border-radius:999px;white-space:nowrap">👤 ' + escHtml(c.assignedOperator || 'ოპერატორთან') + '</span>';
    var hasAiMsg = (c.messages || []).some(function(m){ return m.from === 'ai'; });
    if(hasAiMsg) return '<span style="font-size:.66rem;font-weight:700;color:#fff;background:var(--blue-deep);padding:1px 6px;border-radius:999px;white-space:nowrap">🤖 AI</span>';
    return '';
  }
  // "status" bucket used by the chat-list filter dropdown — kept separate from
  // chatAiTagHtml's display string since the filter needs stable keys, not text
  function chatStatusBucket(c){
    if(c.status === 'closed') return 'closed';
    if(c.aiPaused && !c.operatorJoined) return 'waiting';
    if(c.operatorJoined) return 'joined';
    return 'ai';
  }
  function chatDateFilterMatch(c, key){
    if(!key || key === 'all') return true;
    var at = c.lastAt || 0;
    if(!at) return false;
    var now = Date.now();
    var day = 24 * 60 * 60 * 1000;
    if(key === 'today'){
      var d1 = new Date(at), d2 = new Date(now);
      return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
    }
    if(key === 'week') return (now - at) <= 7 * day;
    if(key === 'month') return (now - at) <= 30 * day;
    return true;
  }
  function chatKnownOperators(){
    var names = {};
    chatSortedList().forEach(function(c){ if(c.assignedOperator) names[c.assignedOperator] = true; });
    return Object.keys(names).sort();
  }
  function refreshChatOperatorFilterOptions(){
    var sel = document.getElementById('chat-filter-operator');
    if(!sel) return;
    var names = chatKnownOperators();
    var current = chatState.filterOperator || 'all';
    if(current !== 'all' && names.indexOf(current) === -1) names.push(current);
    sel.innerHTML = '<option value="all">ყველა ოპერატორი</option>' + names.map(function(n){
      return '<option value="' + escHtml(n) + '"' + (n === current ? ' selected' : '') + '>' + escHtml(n) + '</option>';
    }).join('');
    sel.value = current;
  }
  function renderChatListDom(){
    var listEl = document.getElementById('chat-list');
    if(!listEl) return;
    refreshChatOperatorFilterOptions();
    var q = (chatState.searchQuery || '').toLowerCase();
    var statusFilter = chatState.filterStatus || 'all';
    var operatorFilter = chatState.filterOperator || 'all';
    var dateFilter = chatState.filterDate || 'all';
    var items = chatSortedList().filter(function(c){
      if(q && (c.name || '').toLowerCase().indexOf(q) === -1 && (c.phone || '').toLowerCase().indexOf(q) === -1) return false;
      if(statusFilter !== 'all' && chatStatusBucket(c) !== statusFilter) return false;
      if(operatorFilter !== 'all' && c.assignedOperator !== operatorFilter) return false;
      if(!chatDateFilterMatch(c, dateFilter)) return false;
      return true;
    });
    listEl.innerHTML = items.length ? items.map(function(c){
      var lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length - 1] : null;
      var preview = lastMsg ? (emoticonsToEmoji(lastMsg.text) || (lastMsg.attachment ? '📎 ' + (lastMsg.attachment.name || 'ფაილი') : '')) : '';
      return '<button type="button" class="chat-list-item" data-chat-id="' + escHtml(c.id) + '" style="display:block;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:' + (c.id === chatState.selectedId ? 'var(--blue-soft)' : 'transparent') + ';cursor:pointer">'
        + '<div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">'
        + '<span style="font-weight:800;font-size:.86rem">' + escHtml(c.name || '—') + '</span>'
        + (c.unread ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--bad,#B3261E);flex:none"></span>' : '')
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:1px">'
        + '<span style="font-size:.76rem;color:var(--ink-faint)">' + escHtml(c.phone || '') + (c.status === 'closed' ? ' · დახურულია' : '') + '</span>'
        + chatAiTagHtml(c)
        + '</div>'
        + '<div style="font-size:.8rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">' + escHtml(preview) + '</div>'
        + '</button>';
    }).join('') : ('<div class="empty-state" style="padding:24px 14px"><p>' + ((q || statusFilter !== 'all' || operatorFilter !== 'all' || dateFilter !== 'all') ? 'ვერაფერი მოიძებნა ამ ფილტრით.' : 'ჯერ არცერთი საუბარი არ დაწყებულა.') + '</p></div>');
  }
  // ---- AI-agent reply formatting (ported from technoline.html's identical
  // functions, so an AI reply looks the same to the operator here as it did
  // to the customer): turns "- "/"• " lines into a real bullet list, splits
  // a branch-info bullet's address/hours/phone onto their own lines, and
  // linkifies phone numbers and known branch addresses. Only ever applied to
  // m.from === 'ai' messages — a customer's or operator's own text is shown
  // as plain escaped text, exactly as before. ----
  function chatEscHtml(text){
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // state.branches only holds overridden fields per branch id — merge with
  // BRANCHES_DEFAULTS the same way renderBranchesPanel does, so a branch
  // address the admin hasn't touched yet still gets recognized and linked.
  function effectiveBranchesList(){
    return BRANCHES_DEFAULTS.map(function(def){
      var o = (state.branches && state.branches[def.id]) || {};
      return {
        name: o.name != null ? o.name : def.name,
        addr: o.addr != null ? o.addr : def.addr
      };
    });
  }
  function linkifyPhoneNumbers(text){
    var raw = String(text == null ? '' : text);
    var re = /(\+?\d[\d\s\-().]{6,}\d)/g;
    var out = '', lastIndex = 0, match;
    while((match = re.exec(raw))){
      out += chatEscHtml(raw.slice(lastIndex, match.index));
      var candidate = match[0];
      var digits = candidate.replace(/\D/g, '');
      // A bare, unformatted run of digits (no "+", no spaces/dashes/parens)
      // is far more likely to be a serial number, order code, or warranty
      // card number written out in full than a phone number, so only
      // linkify when the candidate actually looks phone-shaped.
      var looksLikePhone = candidate.charAt(0) === '+' || /[\s\-().]/.test(candidate);
      if(looksLikePhone && digits.length >= 9 && digits.length <= 15){
        var tel = candidate.replace(/[^\d+]/g, '');
        out += '<a class="chat-tel-link" href="tel:' + tel + '">' + chatEscHtml(candidate) + '</a>';
      } else {
        out += chatEscHtml(candidate);
      }
      lastIndex = match.index + candidate.length;
    }
    out += chatEscHtml(raw.slice(lastIndex));
    return out;
  }
  function linkifyBranchLocations(text){
    var out = String(text == null ? '' : text);
    var tokens = [];
    effectiveBranchesList().forEach(function(b){
      if(!b || !b.addr) return;
      [b.addr, b.name].forEach(function(needle){
        if(!needle) return;
        var idx = out.indexOf(needle);
        while(idx !== -1){
          var token = '\u0000MAPLINK' + tokens.length + '\u0000';
          var mapUrl = 'https://www.google.com/maps?q=' + encodeURIComponent(b.addr);
          tokens.push('<a class="chat-map-link" href="' + mapUrl + '" target="_blank" rel="noopener">'
            + chatEscHtml(needle) + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-pin"/></svg></a>');
          out = out.slice(0, idx) + token + out.slice(idx + needle.length);
          idx = out.indexOf(needle, idx + token.length);
        }
      });
    });
    return { text: out, tokens: tokens };
  }
  function restoreMapTokens(html, tokens){
    tokens.forEach(function(tok, i){ html = html.split('\u0000MAPLINK' + i + '\u0000').join(tok); });
    return html;
  }
  function splitBulletLine(line){
    var m = line.match(/^(\u0000MAPLINK\d+\u0000)\s*[.,]?\s*(.*)$/);
    if(!m) return null;
    var rest = m[2].trim();
    if(!rest) return null;
    var restParts = rest.split(/;\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!restParts.length) return null;
    return [m[1]].concat(restParts);
  }
  function formatChatReplyHtml(text){
    var protectedText = linkifyBranchLocations(text);
    var lines = protectedText.text.split(/\r?\n/);
    var parts = [];
    var bulletBuf = [];
    function flushBullets(){
      if(!bulletBuf.length) return;
      parts.push('<ul class="chat-msg-list">' + bulletBuf.map(function(l){
        var segments = splitBulletLine(l);
        if(segments && segments.length > 1){
          return '<li>' + segments.map(function(seg){
            return '<span class="chat-bullet-line">' + linkifyPhoneNumbers(seg) + '</span>';
          }).join('') + '</li>';
        }
        return '<li>' + linkifyPhoneNumbers(l) + '</li>';
      }).join('') + '</ul>');
      bulletBuf = [];
    }
    lines.forEach(function(line){
      var bulletMatch = line.match(/^\s*[-•]\s+(.*)$/);
      if(bulletMatch){
        bulletBuf.push(bulletMatch[1]);
        return;
      }
      flushBullets();
      if(line.trim() === '') return;
      parts.push('<p class="chat-msg-line">' + linkifyPhoneNumbers(line) + '</p>');
    });
    flushBullets();
    return restoreMapTokens(parts.join(''), protectedText.tokens);
  }

  function chatAttachmentHtml(att){
    if(!att || !att.dataUrl) return '';
    if(/^image\//.test(att.type || '')){
      return '<img class="chat-attachment-img" src="' + att.dataUrl.replace(/"/g,'&quot;') + '" alt="' + escHtml(att.name || '') + '">';
    }
    if(/^audio\//.test(att.type || '')){
      return '<audio class="chat-attachment-audio" controls src="' + att.dataUrl.replace(/"/g,'&quot;') + '"></audio>';
    }
    var isPdf = (att.type === 'application/pdf') || /\.pdf$/i.test(att.name || '');
    var icon = isPdf ? '📕' : '📎';
    var nameHtml = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(att.name || 'ფაილი') + '</span>';
    var typeHtml = isPdf ? '<span style="font-size:.66rem;font-weight:800;letter-spacing:.02em;color:#D64545">PDF დოკუმენტი</span>' : '';

    function clearAttachPreview(){
      chatState.pendingAttachment = null;

      if(fi) fi.value = '';

    function stageAttachment(file){
      if(!file) return;
      if(file.size > CHAT_ADMIN_MAX_FILE_BYTES){ setReplyStatus('ფაილი ზედმეტად დიდია — მაქსიმუმ 5MB'); return; }
      var reader = new FileReader();
      reader.onload = function(){
        chatState.pendingAttachment = { name: file.name || 'ფაილი', type: file.type || '', dataUrl: reader.result };
        var prev = document.getElementById('chat-attach-preview');
        var img = document.getElementById('chat-attach-preview-img');
        var nameEl = document.getElementById('chat-attach-preview-name');
        if(/^image\//.test(file.type || '') && img){ img.src = reader.result; img.style.display = 'block'; } else if(img){ img.style.display = 'none'; }
        if(nameEl) nameEl.textContent = file.name || 'ფაილი';
        if(prev) prev.classList.add('show');
        setReplyStatus('');
      };
      reader.onerror = function(){ setReplyStatus('ფაილის წაკითხვა ვერ მოხერხდა'); };
      reader.readAsDataURL(file);
    }
    function sendReply(){
      var input = document.getElementById('chat-reply-input');
      var text = input.value.trim();
      var attachment = chatState.pendingAttachment;
      if((!text && !attachment) || !chatState.ws || !chatState.wsReady) return;
      var payload = {type:'reply', chatId:c.id, text:text, operatorName: chatOperatorName() || 'ოპერატორი'};
      if(attachment) payload.attachment = attachment;
      chatState.ws.send(JSON.stringify(payload));
      var m = {from:'admin', text:text, at:Date.now()};
      if(attachment) m.attachment = attachment;
      c.messages = c.messages || [];

      appendChatMessageDom(m);

    document.getElementById('chat-reply-input').addEventListener('keydown', function(e){ if(e.key === 'Enter') sendReply(); });
    // operators routinely have a screenshot already on the clipboard (a
    // Snipping Tool capture, a copied image) and expect Ctrl+V to attach it
    // here the same way it already works in the customer-facing widget —
    // this was the one input the reply box didn't wire up.
    document.getElementById('chat-reply-input').addEventListener('paste', function(e){
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for(var i = 0; i < items.length; i++){
        if(items[i].kind === 'file'){

    document.getElementById('chat-reply-emoji-btn').addEventListener('click', function(){
      var pop = document.getElementById('chat-emoji-popover');

          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = em;
          b.addEventListener('click', function(){
            var inputEl = document.getElementById('chat-reply-input');
            var start = inputEl.selectionStart || inputEl.value.length;
            var end = inputEl.selectionEnd || inputEl.value.length;
            inputEl.value = inputEl.value.slice(0, start) + em + inputEl.value.slice(end);
            inputEl.focus();
            inputEl.selectionStart = inputEl.selectionEnd = start + em.length;

        });

    document.getElementById('chat-reply-mic-btn').addEventListener('click', function(){
      if(chatAdminMediaRecorder && chatAdminMediaRecorder.state === 'recording'){ chatAdminMediaRecorder.stop(); return; }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
        setReplyStatus('თქვენი ბრაუზერი არ უჭერს მხარს ხმის ჩაწერას');
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        chatAdminAudioChunks = [];
        var mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
        chatAdminMediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
        chatAdminMediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size) chatAdminAudioChunks.push(e.data); };
        chatAdminMediaRecorder.onstop = function(){
          stream.getTracks().forEach(function(t){ t.stop(); });
          clearInterval(chatAdminRecordTimer);
          var micBtn = document.getElementById('chat-reply-mic-btn');
          if(micBtn) micBtn.classList.remove('recording');
          setReplyStatus('');
          var blob = new Blob(chatAdminAudioChunks, { type: chatAdminMediaRecorder.mimeType || 'audio/webm' });
          if(blob.size < 300 || !chatState.ws || !chatState.wsReady) return;
          var reader = new FileReader();
          reader.onload = function(){
            var att = { name: 'ხმოვანი შეტყობინება.webm', type: blob.type || 'audio/webm', dataUrl: reader.result };
            chatState.ws.send(JSON.stringify({ type: 'reply', chatId: c.id, text: '', attachment: att, operatorName: chatOperatorName() || 'ოპერატორი' }));
            var m = { from: 'admin', text: '', attachment: att, at: Date.now() };
            c.messages = c.messages || [];
            c.messages.push(m);
            c.lastAt = m.at;
            appendChatMessageDom(m);
            renderChatListDom();
          };
          reader.readAsDataURL(blob);
        };
        chatAdminMediaRecorder.start();
        var micBtn2 = document.getElementById('chat-reply-mic-btn');
        if(micBtn2) micBtn2.classList.add('recording');
        chatAdminRecordStart = Date.now();
        chatAdminRecordTimer = setInterval(function(){
          var sec = Math.floor((Date.now() - chatAdminRecordStart) / 1000);
          setReplyStatus('იწერება… ' + Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60));
        }, 500);
      }).catch(function(){ setReplyStatus('მიკროფონზე წვდომა ვერ მოხერხდა'); });
    });
  }

  // Knowledge base shape: {folders:[{id,name,enabled}], entries:[{id,title,body,folderId,enabled}],
  // abilities:{bookVisit,warrantyCard}}. Old flat KBs (entries only) are moved
  // into one "ზოგადი" folder on load; a totally empty KB gets starter folders
  // describing Tato's two built-in chat actions.
  function newFolderId(){ return 'kf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function normalizeKb(d){
    d = d || {};
    var kb = {
      folders: Array.isArray(d.folders) ? d.folders.filter(function(f){ return f && f.id; }) : [],
      entries: Array.isArray(d.entries) ? d.entries : [],
      abilities: {
        bookVisit: !(d.abilities && d.abilities.bookVisit === false),
        warrantyCard: !(d.abilities && d.abilities.warrantyCard === false)
      }
    };
    if(!kb.folders.length){
      if(kb.entries.length){
        kb.folders.push({id:newFolderId(), name:'ზოგადი', enabled:true});
      } else {
        var fv = {id:newFolderId(), name:'ვიზიტის დაჯავშნა', enabled:true};
        var fw = {id:newFolderId(), name:'საგარანტიო ბარათი', enabled:true};
        kb.folders.push(fv, fw);
        kb.entries.push(
          {id:newKbId(), folderId:fv.id, enabled:true, title:'როგორ დავჯავშნო ვიზიტი?',
           body:'ვიზიტის დაჯავშნა შეიძლება საიტზე ღილაკით „ვიზიტის დაჯავშნა“ ან პირდაპირ ამ ჩატში. საჭიროა ფილიალი, მოწყობილობის ტიპი, პრობლემის ტიპი, თარიღი და საათი. დაჯავშნის შემდეგ მომხმარებელი იღებს დადასტურების კოდს.'},
          {id:newKbId(), folderId:fw.id, enabled:true, title:'როგორ აღვადგინო საგარანტიო ბარათი?',
           body:'საგარანტიო ბარათის მისაღებად ჩატში მიუთითეთ მოწყობილობის სერიული ნომერი ან გამოაგზავნეთ ყუთის ფოტო სერიული ნომრით (IMEI/S/N). თუ ბარათი მოიძებნა, PDF სახით ჩატშივე გამოგეგზავნებათ. უსაფრთხოების მიზნით ბარათი მხოლოდ იმ მომხმარებელს ეგზავნება, ვისი ტელეფონის ნომერიც ბარათზეა მითითებული.'}
        );
      }
    }
    kb.entries.forEach(function(e){
      if(!e.id) e.id = newKbId();

  function renderChatAiAvatarCell(){
    var cell = document.getElementById('chat-ai-avatar-cell');
    if(!cell) return;
    var val = (chatState.hours && chatState.hours.aiAvatar) || '';
    cell.innerHTML = (val ? '<img class="part-thumb" src="'+val+'" alt="">' : '<div class="part-thumb-empty">🤖</div>')
      + '<div class="part-photo-actions">'
        + '<label>ატვირთვა<input type="file" accept="image/*" id="chat-ai-avatar-file"></label>'
        + (val ? '<button type="button" id="chat-ai-avatar-clear">წაშლა</button>' : '')
      + '</div>';
    var fileInp = document.getElementById('chat-ai-avatar-file');
    if(fileInp){
      fileInp.addEventListener('change', function(){
        var file = fileInp.files && fileInp.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var img = new Image();
          img.onload = function(){
            var scale = Math.min(1, 160 / img.width);
            var w = Math.round(img.width * scale), h2 = Math.round(img.height * scale);
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h2;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h2);
            chatState.hours = chatState.hours || CHAT_HOURS_DEFAULT;
            chatState.hours.aiAvatar = canvas.toDataURL('image/jpeg', .85);
            renderChatAiAvatarCell();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    var clearBtn = document.getElementById('chat-ai-avatar-clear');
    if(clearBtn){
      clearBtn.addEventListener('click', function(){
        if(chatState.hours) chatState.hours.aiAvatar = '';
        renderChatAiAvatarCell();
      });
    }
  }

  function renderKbEntries(){
    var wrap = document.getElementById('chat-kb-entries');
    var kb = chatState.kb;
    if(!wrap || !kb) return;
    chatState.kbOpen = chatState.kbOpen || {};

    var ab = document.getElementById('chat-kb-abilities');
    if(ab){
      ab.innerHTML = KB_ABILITIES.map(function(a){
        return '<label style="display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;margin-bottom:8px;cursor:pointer"><input type="checkbox" data-kb-ability="'+a.key+'"'+(kb.abilities[a.key]!==false?' checked':'')+'> '+a.label+'</label>';
      }).join('');
    }
    var pf = document.getElementById('chat-kb-parse-folder');
    if(pf){
      var cur = pf.value;
      pf.innerHTML = kb.folders.map(function(f){ return '<option value="'+escAttr(f.id)+'">'+escHtml(f.name||'უსახელო')+'</option>'; }).join('');
      if(cur && kb.folders.some(function(f){ return f.id === cur; })) pf.value = cur;
    }

    var html = '';
    kb.folders.forEach(function(f){
      var inF = kb.entries.filter(function(e){ return e.folderId === f.id; });
      var open = !!chatState.kbOpen[f.id];
      html += '<div class="card" data-kb-folder="'+escAttr(f.id)+'" style="margin-bottom:10px;padding:0;overflow:hidden;'+(f.enabled===false?'opacity:.6':'')+'">'
        + '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper-soft)">'
        + '<button type="button" class="drag-eye" style="font-size:1.2rem" data-kb-fold="'+escAttr(f.id)+'" title="გახსნა/დაკეცვა">'+(open?'📂':'📁')+'</button>'
        + '<div class="field-block" style="flex:1;margin:0"><input type="text" data-kb-folder-name="'+escAttr(f.id)+'" value="'+escAttr(f.name||'')+'" placeholder="საქაღალდის სახელი" style="font-weight:800"></div>'
        + '<span style="font-size:.78rem;color:var(--ink-faint);white-space:nowrap">'+inF.length+' საკითხი</span>'
        + '<label style="display:flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap"><input type="checkbox" data-kb-folder-on="'+escAttr(f.id)+'"'+(f.enabled!==false?' checked':'')+'> ჩართ.</label>'
        + '<button type="button" class="drag-eye" data-kb-folder-del="'+escAttr(f.id)+'" title="საქაღალდის წაშლა">🗑</button>'
        + '</div>';
      if(open){
        html += '<div style="padding:12px 14px">'
          + (inF.length ? inF.map(function(e,i){ return kbEntryHtml(e, i, kb); }).join('') : '<p style="font-size:.82rem;color:var(--ink-faint);margin:0 0 10px">ამ საქაღალდეში საკითხი ჯერ არ არის.</p>')
          + '<button type="button" class="btn btn-ghost" data-kb-add-entry="'+escAttr(f.id)+'">+ ახალი საკითხი</button>'
          + '</div>';
      }
      html += '</div>';
    });
    wrap.innerHTML = html || '<p style="font-size:.82rem;color:var(--ink-faint);margin:0 0 12px">ჯერ არცერთი საქაღალდე არ არის.</p>';

    if(!wrap._kbWired){
      wrap._kbWired = true;
      var find = function(list, id){ return list.find(function(x){ return x.id === id; }); };
      wrap.addEventListener('input', function(ev){
        var t = ev.target, kb2 = chatState.kb;
        if(t.hasAttribute('data-kb-field')){
          var entry = find(kb2.entries, t.closest('[data-kb-id]').getAttribute('data-kb-id'));
          if(entry) entry[t.getAttribute('data-kb-field')] = t.value;
        } else if(t.hasAttribute('data-kb-folder-name')){
          var fo = find(kb2.folders, t.getAttribute('data-kb-folder-name'));
          if(fo) fo.name = t.value;
        }
      });
      wrap.addEventListener('change', function(ev){
        var t = ev.target, kb2 = chatState.kb;
        if(t.hasAttribute('data-kb-entry-on')){
          var e1 = find(kb2.entries, t.getAttribute('data-kb-entry-on')); if(e1) e1.enabled = t.checked; renderKbEntries();
        } else if(t.hasAttribute('data-kb-folder-on')){
          var f1 = find(kb2.folders, t.getAttribute('data-kb-folder-on')); if(f1) f1.enabled = t.checked; renderKbEntries();
        } else if(t.hasAttribute('data-kb-entry-folder')){
          var e2 = find(kb2.entries, t.getAttribute('data-kb-entry-folder')); if(e2) e2.folderId = t.value; renderKbEntries();
        } else if(t.hasAttribute('data-kb-folder-name')){
          renderKbEntries();
        }
      });
      wrap.addEventListener('click', function(ev){
        var btn = ev.target.closest('button');
        if(!btn) return;
        var kb2 = chatState.kb;
        if(btn.hasAttribute('data-kb-fold')){
          var id = btn.getAttribute('data-kb-fold'); chatState.kbOpen[id] = !chatState.kbOpen[id]; renderKbEntries();
        } else if(btn.hasAttribute('data-kb-delete')){
          var did = btn.getAttribute('data-kb-delete');
          kb2.entries = kb2.entries.filter(function(e){ return e.id !== did; }); renderKbEntries();
        } else if(btn.hasAttribute('data-kb-folder-del')){
          var fid = btn.getAttribute('data-kb-folder-del');
          var fo2 = find(kb2.folders, fid);
          var cnt = kb2.entries.filter(function(e){ return e.folderId === fid; }).length;
          if(!confirm('წავშალო საქაღალდე „' + ((fo2 && fo2.name) || '') + '“' + (cnt ? ' და მასში არსებული ' + cnt + ' საკითხი' : '') + '?')) return;
          kb2.folders = kb2.folders.filter(function(f){ return f.id !== fid; });
          kb2.entries = kb2.entries.filter(function(e){ return e.folderId !== fid; });
          renderKbEntries();
        } else if(btn.hasAttribute('data-kb-add-entry')){
          var aid = btn.getAttribute('data-kb-add-entry');
          kb2.entries.push({id:newKbId(), folderId:aid, enabled:true, title:'', body:''});
          chatState.kbOpen[aid] = true; renderKbEntries();
        }
      });
    }
    if(ab && !ab._kbWired){
      ab._kbWired = true;
      ab.addEventListener('change', function(ev){
        var k = ev.target.getAttribute('data-kb-ability');
        if(k && chatState.kb) chatState.kb.abilities[k] = ev.target.checked;
      });
    }
  }

  // ---- Chat analytics: computed entirely from the same chats data the
  // "ლაივ ჩატი" tab already loads (chatState.chats) — no new backend
  // endpoint needed, just aggregation on the client.
  function computeChatAnalytics(chatsObj){
    var list = Object.keys(chatsObj || {}).map(function(id){ return chatsObj[id]; }).filter(function(c){ return c && c.messages && c.messages.length; });
    var total = list.length;
    var escalated = 0;
    var aiResponseMs = [], adminResponseMs = [];
    var byMonth = {}, byDay = {}, byOperator = {};

    list.forEach(function(c){
      var created = c.createdAt || c.messages[0].at || Date.now();
      var d = new Date(created);
      var mKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      var dKey = mKey + '-' + String(d.getDate()).padStart(2, '0');
      if(!byMonth[mKey]) byMonth[mKey] = {total:0, ai:0, operator:0};
      if(!byDay[dKey]) byDay[dKey] = {total:0, ai:0, operator:0};
      byMonth[mKey].total++;
      byDay[dKey].total++;
      if(c.operatorJoined){
        escalated++;
        byMonth[mKey].operator++;
        byDay[dKey].operator++;
        var opName = c.assignedOperator || 'უცნობი';
        byOperator[opName] = (byOperator[opName] || 0) + 1;
      } else {
        byMonth[mKey].ai++;
        byDay[dKey].ai++;
      }

      // Response time: pair each customer message with the NEXT ai/admin
      // reply that follows it (skipping system notices), whichever chat it
      // happened in — this compares AI vs human reply speed head-to-head
      // even inside chats that later escalated, rather than only judging
      // whole chats as "AI" or "operator". A gap over 24h (chat abandoned,
      // reopened days later) is excluded as noise, not a real wait.
      var lastCustomerAt = null;
      c.messages.forEach(function(m){
        if(m.from === 'customer'){
          lastCustomerAt = m.at;
        } else if((m.from === 'ai' || m.from === 'admin') && lastCustomerAt != null){
          var rt = m.at - lastCustomerAt;
          if(rt >= 0 && rt < 24 * 3600 * 1000){
            (m.from === 'ai' ? aiResponseMs : adminResponseMs).push(rt);
          }
          lastCustomerAt = null;
        }
      });
    });

    function avg(arr){ return arr.length ? arr.reduce(function(a, b){ return a + b; }, 0) / arr.length : null; }

    return {
      total: total, escalated: escalated, aiOnly: total - escalated,
      escalatedPct: total ? Math.round(escalated / total * 100) : 0,
      avgAiResponseMs: avg(aiResponseMs), avgAdminResponseMs: avg(adminResponseMs),
      aiSamples: aiResponseMs.length, adminSamples: adminResponseMs.length,
      byMonth: byMonth, byDay: byDay, byOperator: byOperator
    };
  }
  function caFmtDuration(ms){
    if(ms == null) return '—';
    var s = Math.round(ms / 1000);
    if(s < 60) return s + ' წმ';
    var m = Math.floor(s / 60), rs = s % 60;
    if(m < 60) return m + ' წთ' + (rs ? ' ' + rs + ' წმ' : '');
    var h = Math.floor(m / 60), rm = m % 60;
    return h + ' სთ' + (rm ? ' ' + rm + ' წთ' : '');
  }
  function caLastNMonths(n){
    var out = [];
    var now = new Date();
    for(var i = n - 1; i >= 0; i--){
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    }
    return out;
  }
  function caLastNDays(n){
    var out = [];
    var now = new Date();
    for(var i = n - 1; i >= 0; i--){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    return out;
  }
  var CA_MONTH_NAMES = ['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
  function caMonthLabel(key){
    var p = key.split('-');
    return CA_MONTH_NAMES[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2);
  }
  function caDayLabel(key){
    var p = key.split('-');
    return p[2] + '.' + p[1];
  }
  // Stacked bar chart, built as plain divs (no canvas/SVG dependency): each
  // bar's two segments are the AI vs operator share of that bucket's chats,
  // height-scaled to the busiest bucket in the range, with a hover tooltip
  // carrying the exact breakdown (bars alone only show relative size).
  function caRenderBarChart(containerEl, keys, dataMap, labelFn, tooltipEl){
    var maxTotal = 1;
    keys.forEach(function(k){ var v = (dataMap[k] || {total:0}).total; if(v > maxTotal) maxTotal = v; });
    var html = '<div class="ca-bars">';
    keys.forEach(function(k){
      var v = dataMap[k] || {total:0, ai:0, operator:0};
      var aiH = v.total ? Math.round((v.ai / maxTotal) * 160) : 0;
      var opH = v.total ? Math.round((v.operator / maxTotal) * 160) : 0;
      if(v.ai && aiH < 2) aiH = 2;
      if(v.operator && opH < 2) opH = 2;
      html += '<div class="ca-bar-group" data-key="' + k + '" data-total="' + v.total + '" data-ai="' + v.ai + '" data-operator="' + v.operator + '">';
      if(v.operator) html += '<div class="ca-bar-seg operator" style="height:' + opH + 'px"></div>';
      if(v.ai) html += '<div class="ca-bar-seg ai" style="height:' + aiH + 'px"></div>';
      if(!v.total) html += '<div class="ca-bar-seg" style="height:2px;background:var(--line)"></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="ca-bar-axis"><span>' + labelFn(keys[0]) + '</span><span>' + labelFn(keys[Math.floor(keys.length / 2)]) + '</span><span>' + labelFn(keys[keys.length - 1]) + '</span></div>';
    containerEl.innerHTML = html;
    containerEl.querySelectorAll('.ca-bar-group').forEach(function(el){
      el.addEventListener('mousemove', function(e){
        var k = el.getAttribute('data-key');
        tooltipEl.innerHTML = '<strong>' + labelFn(k) + '</strong><br>სულ: ' + el.getAttribute('data-total')
          + '<br>AI: ' + el.getAttribute('data-ai') + ' · ოპერატორი: ' + el.getAttribute('data-operator');
        tooltipEl.style.display = 'block';
        tooltipEl.style.left = (e.clientX + 14) + 'px';
        tooltipEl.style.top = (e.clientY - 10) + 'px';
      });
      el.addEventListener('mouseleave', function(){ tooltipEl.style.display = 'none'; });
    });
  }

    html += '<div id="chat-analytics-body"><div class="card"><div class="empty-state"><p>იტვირთება…</p></div></div></div>';
    html += '<div class="ca-tooltip" id="ca-tooltip"></div>';
    main.innerHTML = html;

    function renderBody(){
      var stats = computeChatAnalytics(chatState.chats);
      var body = document.getElementById('chat-analytics-body');
      if(!body) return;
      if(!stats.total){
        body.innerHTML = '<div class="card"><div class="empty-state"><svg><use href="#ic-chat"/></svg><p>ჯერ არ არსებობს ჩატის ისტორია.</p></div></div>';
        return;
      }

      var out = '<div class="ca-stats">'
        + '<div class="ca-tile"><div class="ca-tile-label">სულ ჩატი</div><div class="ca-tile-value">' + stats.total + '</div></div>'
        + '<div class="ca-tile"><div class="ca-tile-label">გადავიდა ოპერატორთან</div><div class="ca-tile-value">' + stats.escalated + '</div><div class="ca-tile-sub">' + stats.escalatedPct + '% სულ ჩატებიდან</div></div>'
        + '<div class="ca-tile"><div class="ca-tile-label">საშ. პასუხის დრო — AI</div><div class="ca-tile-value">' + caFmtDuration(stats.avgAiResponseMs) + '</div><div class="ca-tile-sub">' + stats.aiSamples + ' პასუხის მიხედვით</div></div>'
        + '<div class="ca-tile"><div class="ca-tile-label">საშ. პასუხის დრო — ოპერატორი</div><div class="ca-tile-value">' + caFmtDuration(stats.avgAdminResponseMs) + '</div><div class="ca-tile-sub">' + stats.adminSamples + ' პასუხის მიხედვით</div></div>'
        + '</div>';

      var legendHtml = '<div class="ca-legend">'
        + '<span class="ca-legend-item"><span class="ca-legend-swatch" style="background:var(--series-ai)"></span>AI ჩატი</span>'
        + '<span class="ca-legend-item"><span class="ca-legend-swatch" style="background:var(--series-operator)"></span>ოპერატორთან</span>'
        + '</div>';

      out += '<div class="card"><h3 style="margin:0 0 4px;font-size:.98rem">თვის ტრენდი</h3>'
        + '<p class="field-hint" style="margin:0 0 14px">ბოლო 12 თვის ჩატების რაოდენობა.</p>'
        + legendHtml + '<div class="ca-chart" id="ca-month-chart"></div></div>';

      out += '<div class="card"><h3 style="margin:0 0 4px;font-size:.98rem">დღის ტრენდი</h3>'
        + '<p class="field-hint" style="margin:0 0 14px">ბოლო 30 დღის ჩატების რაოდენობა.</p>'
        + legendHtml + '<div class="ca-chart" id="ca-day-chart"></div></div>';

      var opNames = Object.keys(stats.byOperator).sort(function(a, b){ return stats.byOperator[b] - stats.byOperator[a]; });
      if(opNames.length){
        out += '<div class="card"><h3 style="margin:0 0 4px;font-size:.98rem">ოპერატორების მიხედვით</h3>'
          + '<p class="field-hint" style="margin:0 0 14px">რამდენი ჩატი აიყვანა თითოეულმა ოპერატორმა.</p>'
          + '<table class="ca-table"><thead><tr><th>ოპერატორი</th><th>აყვანილი ჩატები</th></tr></thead><tbody>'
          + opNames.map(function(name){ return '<tr><td>' + escHtml(name) + '</td><td>' + stats.byOperator[name] + '</td></tr>'; }).join('')
          + '</tbody></table></div>';
      }

      body.innerHTML = out;

      var tooltipEl = document.getElementById('ca-tooltip');
      caRenderBarChart(document.getElementById('ca-month-chart'), caLastNMonths(12), stats.byMonth, caMonthLabel, tooltipEl);
      caRenderBarChart(document.getElementById('ca-day-chart'), caLastNDays(30), stats.byDay, caDayLabel, tooltipEl);
    }

    if(!chatState.listLoaded){
      chatState.listLoaded = true;
      apiGet('/api/chats').then(function(list){
        (list || []).forEach(function(c){
          if(!chatState.chats[c.id]) chatState.chats[c.id] = c;
        });
        renderBody();
      }).catch(function(err){
        if(err && err.status === 401){ toast('ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ'); document.getElementById('logout-btn').click(); return; }
        renderBody();
      });
    } else {
      renderBody();
    }
  }

  function renderFeedbackPanel(main, tab){
    var html = panelHeadHtml(tab, 'Smart Q-Logic-დან ავტომატურად მიღებული მომხმარებელთა შეფასებები.');
    html += '<div class="card" style="padding:14px 18px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">'
      + '<input type="text" id="feedback-search" placeholder="ძებნა: კომენტარი, შეკვეთის კოდი, ფილიალი…" style="flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-soft);color:var(--ink);font-size:.9rem">'
      + '<label style="display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-faint);white-space:nowrap"><input type="checkbox" id="feedback-show-test"> სატესტოც</label>'
      + '</div>';
    html += '<div class="card" id="feedback-card"><div class="empty-state"><p>იტვირთება…</p></div></div>';
    main.innerHTML = html;

    var allFeedback = [];
    function starsHtml(score){
      var n = Math.max(0, Math.min(5, Math.round(Number(score) || 0)));
      return '<span style="color:var(--gold,#C9A227);letter-spacing:1px">' + '★'.repeat(n) + '</span>'
        + '<span style="color:var(--line)">' + '★'.repeat(5 - n) + '</span>';
    }
    function feedbackRowHtml(f){
      var criteriaLine = (f.criteria || []).map(function(c){ return escHtml(c.label || c.id) + ': ' + escHtml(c.value); }).join(' · ');
      // rating.test entries can't be featured on the public site — they're
      // Smart Q-Logic's own "send a test message" button, not a real customer.
      var featureBtn = f.isTest
        ? '<span style="color:var(--ink-faint);font-size:.78rem">—</span>'
        : '<button type="button" class="btn ' + (f.featured ? 'btn-gold' : 'btn-ghost') + '" data-feature-id="' + escHtml(f.id) + '" data-feature-on="' + (f.featured ? '0' : '1') + '" style="font-size:.76rem;padding:7px 11px;white-space:nowrap">'
          + (f.featured ? '✓ საიტზეა' : 'საჩვენებლად') + '</button>';
      return '<div class="booking-row" style="grid-template-columns:120px 1fr 140px 90px 120px">'
        + '<div class="bcode">' + starsHtml(f.score) + ' <span style="font-size:.78rem;color:var(--ink-faint)">' + escHtml(f.score) + '</span>'
          + (f.isTest ? '<div style="color:var(--bad,#B3261E);font-size:.72rem;font-weight:800">სატესტო</div>' : '') + '</div>'
        + '<div><div class="bname" style="white-space:normal">' + (f.comment ? escHtml(f.comment) : '<span style="color:var(--ink-faint)">კომენტარის გარეშე</span>') + '</div>'
          + (criteriaLine ? '<div class="bmeta">' + criteriaLine + '</div>' : '') + '</div>'
        + '<div class="bmeta">' + (f.orderCode ? escHtml(f.orderCode) : 'Walk-in') + '<br>ფილიალი #' + escHtml(f.branchId != null ? f.branchId : '—') + '</div>'
        + '<div class="bmeta" style="font-size:.78rem">' + escHtml(fmtDate(f.createdAt)) + '</div>'
        + '<div>' + featureBtn + '</div>'
        + '</div>';
    }
    function renderFeedbackList(q, showTest){
      var card = document.getElementById('feedback-card');
      if(!card) return;
      var list = showTest ? allFeedback : allFeedback.filter(function(f){ return !f.isTest; });
      var filtered = !q ? list : list.filter(function(f){
        return [f.comment, f.orderCode, f.branchId].some(function(v){
          return String(v || '').toLowerCase().indexOf(q) !== -1;
        });
      });
      card.innerHTML = filtered.length
        ? filtered.map(feedbackRowHtml).join('')
        : '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>ვერაფერი მოიძებნა.</p></div>';
    }

    apiGet('/api/feedback').then(function(list){
      allFeedback = list || [];
      var card = document.getElementById('feedback-card');
      if(!card) return;
      if(!allFeedback.length){
        card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>ჯერ არცერთი შეფასება არ მიღებულა.</p></div>';
        return;
      }
      renderFeedbackList('', false);
      document.getElementById('feedback-search').addEventListener('input', function(){
        renderFeedbackList(this.value.trim().toLowerCase(), document.getElementById('feedback-show-test').checked);
      });
      document.getElementById('feedback-show-test').addEventListener('change', function(){
        renderFeedbackList(document.getElementById('feedback-search').value.trim().toLowerCase(), this.checked);
      });
      // delegated (not per-row) since rows get replaced on every filter re-render
      card.addEventListener('click', function(e){
        var btn = e.target.closest('[data-feature-id]');
        if(!btn) return;
        var id = btn.getAttribute('data-feature-id');
        var makeFeatured = btn.getAttribute('data-feature-on') === '1';
        btn.disabled = true;
        apiPut('/api/feedback/' + encodeURIComponent(id) + '/feature', { featured: makeFeatured }).then(function(){
          var item = allFeedback.find(function(f){ return f.id === id; });
          if(item) item.featured = makeFeatured;
          renderFeedbackList(document.getElementById('feedback-search').value.trim().toLowerCase(), document.getElementById('feedback-show-test').checked);
          toast(makeFeatured ? 'შეფასება გამოჩნდება მთავარ გვერდზე' : 'შეფასება მოიხსნა მთავარი გვერდიდან');
        }).catch(function(err){
          btn.disabled = false;
          if(err && err.status === 401){ toast('ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ'); document.getElementById('logout-btn').click(); return; }
          toast('ვერ მოხერხდა — სცადეთ თავიდან');
        });
      });
    }).catch(function(err){
      var card = document.getElementById('feedback-card');
      if(!card) return;
      if(err && err.status === 401){
        card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ.</p></div>';
        document.getElementById('logout-btn').click();
        return;
      }
      card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>შეფასებების ჩატვირთვა ვერ მოხერხდა — შეამოწმეთ სერვერთან კავშირი.</p></div>';
    });
  }

  function fmtDate(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('ka-GE') + ' ' + d.toLocaleTimeString('ka-GE', {hour:'2-digit', minute:'2-digit'});
  }

  function renderUsersPanel(main, tab){
    var html = panelHeadHtml(tab, 'საიტზე SMS-ვერიფიკაციით რეგისტრირებული მომხმარებლები — რეგისტრაციის და ბოლო შესვლის თარიღით.');
    html += '<div class="card" id="users-card"><div class="empty-state"><p>იტვირთება…</p></div></div>';
    main.innerHTML = html;

    apiGet('/api/users').then(function(list){
      var card = document.getElementById('users-card');
      if(!card) return;
      if(!list.length){
        card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>ჯერ არცერთი მომხმარებელი არ დარეგისტრირებულა.</p></div>';
        return;
      }
      card.innerHTML = '<table class="admin-table"><thead><tr>'
        + '<th>სახელი</th><th>ტელეფონი</th><th>ელფოსტა</th><th>რეგისტრაცია</th><th>ბოლო შესვლა</th><th>შეკვეთები / სერვისები</th>'
        + '</tr></thead><tbody>' + list.map(function(u){
          return '<tr>'
            + '<td>'+escHtml(u.name||'—')+'</td>'
            + '<td>'+escHtml(u.phone||'—')+'</td>'
            + '<td>'+escHtml(u.email||'—')+'</td>'
            + '<td>'+escHtml(fmtDate(u.registeredAt))+'</td>'
            + '<td>'+escHtml(fmtDate(u.lastLoginAt))+'</td>'
            + '<td>—</td>'
            + '</tr>';
        }).join('') + '</tbody></table>';
    }).catch(function(err){
      var card = document.getElementById('users-card');
      if(!card) return;
      if(err && err.status === 401){
        card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ.</p></div>';
        document.getElementById('logout-btn').click();
        return;
      }
      card.innerHTML = '<div class="empty-state"><svg><use href="#ic-inbox"/></svg><p>მომხმარებლების ჩატვირთვა ვერ მოხერხდა — შეამოწმეთ სერვერთან კავშირი.</p></div>';
    });
  }

  function saveBarHtml(){
    return '<div class="save-bar"><button class="btn btn-ghost" id="btn-reset">ნაგულისხმევზე დაბრუნება</button><button class="btn btn-gold" id="btn-save">ცვლილებების შენახვა</button></div>';
  }

  function wireSaveBar(tab, getPayload){
    var saveBtn = document.getElementById('btn-save');
    var resetBtn = document.getElementById('btn-reset');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var payload = getPayload();
      var approxBytes = 0;
      try{ approxBytes = JSON.stringify(payload.body).length; }catch(e){}
      if(approxBytes > 24 * 1024 * 1024){
        toast('შენახვა ვერ მოხერხდა — მონაცემები ძალიან დიდია (ვიდეო/ფოტო). შეამცირეთ ატვირთული ფაილის ზომა.');
        return;
      }
      saveBtn.disabled = true; saveBtn.textContent = 'ინახება…';
      apiPut('/api/site/' + payload.path, payload.body).then(function(){
        setDirty(tab, false);
        updateStatusChip(tab);
        toast('ცვლილებები შენახულია');
      }).catch(function(err){
        var msg = (err && err.status === 401) ? 'ავტორიზაცია ვადაგასულია — გთხოვთ თავიდან შეხვიდეთ'
          : (err && err.status === 413) ? 'შენახვა ვერ მოხერხდა — მონაცემები ძალიან დიდია. შეამცირეთ ატვირთული ვიდეოს/ფოტოს ზომა.'
          : 'შენახვა ვერ მოხერხდა — სცადეთ თავიდან';
        toast(msg);
        if(err && err.status === 401) document.getElementById('logout-btn').click();
      }).finally(function(){
        saveBtn.disabled = false; saveBtn.textContent = 'ცვლილებების შენახვა';
      });
    });
    if(resetBtn) resetBtn.addEventListener('click', function(){
      if(!confirm('დარწმუნებული ხართ, რომ გსურთ ამ ჩანართის ნაგულისხმევ მდგომარეობაში დაბრუნება?')) return;
      if(tab.kind === 'content'){
        var store = ckStore();
        if(LIST_CONTENT_PAGES[tab.page]){
          Object.keys(store).forEach(function(k){ if(k.indexOf(tab.page + '.') === 0) delete store[k]; });
        } else {
          CONTENT_ORDER.filter(function(k){ return parseCk(k).page === tab.page; }).forEach(function(k){ delete store[k]; });
        }
      } else if(tab.kind === 'colors'){ THEME_TOKENS.forEach(function(t){ delete state.theme[t.key]; }); }
      else if(tab.kind === 'typography'){
        TYPOGRAPHY_GROUPS.forEach(function(g){ g.fields.forEach(function(f){ delete state.theme[f.key]; }); });
        Object.keys(LAYOUT_GROUPS).forEach(function(gk){
          LAYOUT_GROUPS[gk].fields.forEach(function(f){ delete state.theme[f.posX]; delete state.theme[f.posY]; delete state.theme[f.hidden]; });
        });
        delete state.theme.heroBgType; delete state.theme.heroBgPhoto; delete state.theme.heroMinHeight; delete state.theme.heroBgVideo;
        delete state.theme.craftBgType; delete state.theme.craftBgPhoto; delete state.theme.craftBgVideo;
        delete state.theme.craftAlignV; delete state.theme.craftAlignH;
      }
      else if(tab.kind === 'parts'){ state.parts = {}; }
      else if(tab.kind === 'branches'){ state.branches = {}; }
      else if(tab.kind === 'booking-options'){ state.bookingOptions = defaultBookingOptions(); }
      else if(tab.kind === 'pages'){ NAV_ITEMS.forEach(function(it){ delete state.theme[it.hideKey]; }); HEADER_ICON_ITEMS.forEach(function(it){ delete state.theme[it.hideKey]; }); PAGE_SECTION_ITEMS.forEach(function(it){ delete state.theme[it.hideKey]; }); delete state.theme.navOrder; }
      setDirty(tab, true);
      renderMain();
    });
  }

  /* ---------- boot ---------- */
  function loadAll(){
    return apiGet('/api/site').then(function(data){
      state.content = data.content || {};
      state.contentEn = data.contentEn || {};
      state.theme = data.theme || {};
      state.parts = data.parts || {};
      state.branches = data.branches || {};
      state.bookingOptions = (data.bookingOptions && Array.isArray(data.bookingOptions.devices)) ? data.bookingOptions : defaultBookingOptions();
    }).catch(function(){
      toast('კონტენტის ჩატვირთვა ვერ მოხერხდა — ნაგულისხმევი მონაცემები გამოჩნდება');
    });
  }

  function enterApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('is-active');
    buildTabs();
    checkConnection();
    connectChatWs();
    loadAll().then(function(){
      selectTab(TABS[0].id);
    });
  }

  document.getElementById('mobile-nav-btn').addEventListener('click', function(){
    document.getElementById('sidebar').classList.add('is-open');
    document.getElementById('sidebar-scrim').classList.add('show');
  });
  document.getElementById('sidebar-scrim').addEventListener('click', function(){
    document.getElementById('sidebar').classList.remove('is-open');
    document.getElementById('sidebar-scrim').classList.remove('show');
  });
  function updateMobileNavVisibility(){
    document.getElementById('mobile-nav-btn').style.display = window.innerWidth <= 880 ? 'flex' : 'none';
  }
  window.addEventListener('resize', updateMobileNavVisibility);
  updateMobileNavVisibility();

  /* Auto-enter if a token from an earlier session in this tab is still around. */
  if(authToken){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('is-active');
    buildTabs();
    checkConnection();
    connectChatWs();
    loadAll().then(function(){ selectTab(TABS[0].id); }).catch(function(){});
  }
})();
</script>
